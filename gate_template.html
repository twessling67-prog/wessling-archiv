<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8">

<meta name="theme-color" content="#2e2418"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WESSLING FAMILY ARCHIVE — geschützt</title><style>
 body{background:#2e2418;color:#e8dcc4;font-family:Georgia,serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
 .gate{text-align:center;max-width:420px;padding:30px}
 h1{font-size:19px;letter-spacing:.18em;font-weight:normal}
 p{font-size:13.5px;color:#b3a488;font-family:'Segoe UI',sans-serif}
 input{font-size:16px;padding:10px 14px;border-radius:6px;border:1px solid #6d5b3f;background:#f6f1e7;color:#2e2418;width:100%;box-sizing:border-box;text-align:center;margin:14px 0 10px}
 button{font-family:'Segoe UI',sans-serif;font-size:14px;background:#7d2e2a;color:#f6ecdd;border:none;border-radius:18px;padding:10px 26px;cursor:pointer;font-weight:600}
 .err{color:#d98b84;font-size:13px;min-height:18px;font-family:'Segoe UI',sans-serif}
 .lock{font-size:34px}
</style></head><body>
<div class="gate">
 <svg viewBox="0 0 100 100" style="width:84px;height:84px" aria-hidden="true">
   <rect x="4" y="4" width="92" height="92" rx="20" fill="#f6f1e7"/>
   <rect x="9" y="9" width="82" height="82" rx="16" fill="none" stroke="#9a7b2f" stroke-width="1.6" opacity="0.85"/>
   <g transform="translate(7,21) scale(0.95)"><path d="M 7 55 C 13 40 20 22 26 15 C 29 12 32 14 31.5 20 C 30 33 28 47 26.5 55 C 26 58.5 27 60.5 29.5 59.5 C 31 59 32.5 57 33.5 54 C 37 44 42.5 30 45 21 C 47 14 51 11 56 12.5 C 62 14.5 64.5 21 63.5 29 C 62 40 60 50 58.5 56 C 58 60 60 61 63.5 58.5 C 67.5 55.5 74 52.5 82 51" fill="none" stroke="#7d2e2a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
 </svg>
 <h1>WESSLING FAMILY ARCHIVE</h1>
 <p>Privates Familienarchiv — Zugang nur mit Passwort.<br>Private family archive — password required.<br>Prywatne archiwum rodzinne — wymagane has&#322;o.</p>
 <input id="pw" type="password" placeholder="Passwort / password / hasło" onkeydown="if(event.key===&#39;Enter&#39;)unlock()" autofocus="">
 <div class="err" id="err"></div>
 <label style="display:block;font-family:'Segoe UI',sans-serif;font-size:12.5px;color:#b3a488;margin:2px 0 12px;cursor:pointer">
  <input type="checkbox" id="remember" style="width:auto;margin:0 6px 0 0;vertical-align:middle"><span style="vertical-align:middle">Auf diesem Ger&auml;t merken &middot; Remember on this device &middot; Zapami&#281;taj na tym urz&#261;dzeniu</span>
 </label>
 <button onclick="unlock()">&Ouml;ffnen &middot; Open &middot; Otw&oacute;rz</button>
 <p id="forget" style="display:none;margin-top:14px"><a href="#" onclick="localStorage.removeItem('wfa_pw');document.getElementById('forget').style.display='none';document.getElementById('err').textContent='Gespeichertes Passwort entfernt / saved password removed / zapisane hasło usunięte';return false" style="color:#b3a488;font-size:12px">Passwort auf diesem Ger&auml;t vergessen &middot; Forget saved password</a></p>
</div>
<script>
const B64="__B64__";
async function unlock(pwArg){
  const err=document.getElementById('err');err.textContent='…';
  const auto=(typeof pwArg==='string');
  try{
    const raw=Uint8Array.from(atob(B64),c=>c.charCodeAt(0));
    const salt=raw.slice(0,16),nonce=raw.slice(16,28),ct=raw.slice(28);
    const pw=auto?pwArg:document.getElementById('pw').value;
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:nonce},key,ct);
    const html=new TextDecoder().decode(pt);
    try{
      if(!auto&&document.getElementById('remember').checked){localStorage.setItem('wfa_pw',btoa(unescape(encodeURIComponent(pw))));}
    }catch(_){}
    const f=document.createElement('iframe');
    f.setAttribute('style','position:fixed;inset:0;width:100vw;height:100vh;border:0;background:#f6f1e7');
    f.setAttribute('title','Archiv');
    document.body.innerHTML='';document.body.style.margin='0';document.body.style.background='#f6f1e7';
    document.body.appendChild(f);
    f.srcdoc=html;
  }catch(e){
    if(auto){try{localStorage.removeItem('wfa_pw');}catch(_){}}
    else{err.textContent='Falsches Passwort / wrong password / błędne hasło';}
  }
}
(function(){
  try{
    const s=localStorage.getItem('wfa_pw');
    if(s){document.getElementById('forget').style.display='block';unlock(decodeURIComponent(escape(atob(s))));}
  }catch(_){}
})();
</script></body></html>
