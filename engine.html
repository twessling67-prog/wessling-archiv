<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wessling-Archiv — Prototyp</title>
<style>
  :root{
    --paper:#f6f1e7; --paper-deep:#efe7d7; --card:#fdfaf3;
    --ink:#2e2418; --ink-soft:#5c4f3d; --ink-faint:#8a7c66;
    --accent:#7d2e2a; --accent-soft:#a2554f; --gold:#9a7b2f;
    --line:#d9cdb8; --ok:#3f6b45; --warn:#8a6d1f;
    --shadow:0 1px 3px rgba(46,36,24,.10), 0 6px 18px rgba(46,36,24,.07);
    --serif:Georgia,'Times New Roman',serif;
    --sans:'Segoe UI',system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--serif);line-height:1.6}
  a{color:var(--accent);cursor:pointer;text-decoration:none}
  a:hover{text-decoration:underline}
  .demo-banner{background:#3a2f1f;color:#e8dcc4;font-family:var(--sans);font-size:12.5px;
    text-align:center;padding:6px 12px;letter-spacing:.02em}
  header.site{background:var(--card);border-bottom:3px double var(--line);padding:18px 28px 0;
    position:sticky;top:0;z-index:50;box-shadow:0 2px 10px rgba(46,36,24,.06)}
  .masthead{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:10px}
  .brand{display:flex;align-items:baseline;gap:14px;cursor:pointer}
  .brand h1{font-size:20px;font-weight:normal;letter-spacing:.16em}
  .brand h1 .amp{color:var(--accent);font-style:italic}
  .brand .sub{font-family:var(--sans);font-size:11.5px;color:var(--ink-faint);
    text-transform:uppercase;letter-spacing:.18em}
  .head-tools{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .search-wrap{position:relative}
  .search-wrap input{font-family:var(--sans);font-size:13.5px;padding:7px 12px 7px 32px;
    border:1px solid var(--line);border-radius:18px;background:var(--paper);color:var(--ink);
    width:250px;outline:none}
  .search-wrap input:focus{border-color:var(--accent-soft)}
  .search-wrap .icon{position:absolute;left:11px;top:7px;color:var(--ink-faint);font-size:13px}
  .lang-switch{display:flex;border:1px solid var(--line);border-radius:16px;overflow:hidden;
    font-family:var(--sans);font-size:12.5px}
  .lang-switch button{border:none;background:var(--paper);color:var(--ink-soft);padding:6px 13px;
    cursor:pointer;font-weight:600;letter-spacing:.04em}
  .lang-switch button.active{background:var(--accent);color:#f6ecdd}
  nav.main{display:flex;gap:4px;margin-top:12px;flex-wrap:wrap}
  nav.main button{font-family:var(--sans);font-size:13.5px;border:none;background:none;
    color:var(--ink-soft);padding:9px 15px;cursor:pointer;border-bottom:3px solid transparent}
  nav.main button:hover{color:var(--accent)}
  nav.main button.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
  main{max-width:1100px;margin:0 auto;padding:30px 24px 80px}
  h2.page{font-size:30px;font-weight:normal;margin-bottom:6px}
  .page-sub{font-family:var(--sans);color:var(--ink-faint);font-size:13.5px;margin-bottom:26px}
  .rule{border:none;border-top:1px solid var(--line);margin:22px 0}
  .grid{display:grid;gap:18px}
  .grid.cols3{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
  .grid.cols2{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
  .card{background:var(--card);border:1px solid var(--line);border-radius:6px;
    padding:18px 20px;box-shadow:var(--shadow)}
  .card h3{font-size:18px;font-weight:normal;margin-bottom:4px}
  .card h3 a{color:var(--ink)} .card h3 a:hover{color:var(--accent)}
  .meta{font-family:var(--sans);font-size:12px;color:var(--ink-faint);margin-bottom:8px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .chip{font-family:var(--sans);font-size:11.5px;background:var(--paper-deep);
    border:1px solid var(--line);border-radius:12px;padding:2px 10px;color:var(--ink-soft);cursor:pointer}
  .chip:hover{border-color:var(--accent-soft);color:var(--accent)}
  .chip.strand{background:#ece2f0;border-color:#cbb8d6;color:#5b3a6e}
  .badge{font-family:var(--sans);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;
    border-radius:3px;padding:2px 7px;font-weight:700}
  .badge.ok{background:#e2ecdf;color:var(--ok)}
  .badge.rough{background:#f2e8cf;color:var(--warn)}
  .badge.open{background:#f0dede;color:var(--accent)}
  .badge.type{background:var(--paper-deep);color:var(--ink-soft)}
  .hero{display:grid;grid-template-columns:1.4fr 1fr;gap:26px;margin-bottom:30px}
  @media(max-width:800px){.hero{grid-template-columns:1fr}}
  .hero .welcome{background:var(--card);border:1px solid var(--line);border-radius:6px;
    padding:26px 28px;box-shadow:var(--shadow)}
  .hero .welcome p{margin-top:10px;color:var(--ink-soft)}
  .strand-list{display:flex;flex-direction:column;gap:10px}
  .strand-row{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--accent);
    border-radius:4px;padding:10px 16px;cursor:pointer;font-family:var(--sans);font-size:14px}
  .strand-row:hover{background:var(--paper-deep)}
  .strand-row b{font-size:15px}
  .strand-row span{color:var(--ink-faint);font-size:12px;display:block}
  .filterbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;font-family:var(--sans)}
  .filterbar button{font-size:12.5px;border:1px solid var(--line);background:var(--card);
    border-radius:15px;padding:5px 14px;cursor:pointer;color:var(--ink-soft)}
  .filterbar button.active{background:var(--accent);color:#f6ecdd;border-color:var(--accent)}
  .detail-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;flex-wrap:wrap}
  .backlink{font-family:var(--sans);font-size:12.5px;color:var(--ink-faint);display:inline-block;margin-bottom:14px}
  .person-layout{display:grid;grid-template-columns:2fr 1fr;gap:24px;margin-top:18px}
  @media(max-width:800px){.person-layout{grid-template-columns:1fr}}
  .factbox{background:var(--paper-deep);border:1px solid var(--line);border-radius:6px;padding:16px 18px;
    font-family:var(--sans);font-size:13px}
  .factbox dt{color:var(--ink-faint);font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin-top:10px}
  .factbox dd{margin:1px 0 0}
  .portrait{width:100%;aspect-ratio:4/5;background:linear-gradient(150deg,#e6dcc6,#d5c6a8);
    border:1px solid var(--line);border-radius:4px;display:flex;align-items:center;justify-content:center;
    color:#8a7b5e;font-family:var(--sans);font-size:12px;margin-bottom:12px;text-align:center;padding:10px}
  .prose p{margin-bottom:12px}
  .prose .cite{font-family:var(--sans);font-size:11px;color:var(--gold);vertical-align:super;cursor:pointer}
  .mention-list li{margin-bottom:10px}
  .mention-list{list-style:none}
  .snippet{color:var(--ink-soft);font-style:italic;font-size:14.5px}
  .source-layout{display:grid;grid-template-columns:1fr 1.25fr;gap:24px;margin-top:20px}
  @media(max-width:860px){.source-layout{grid-template-columns:1fr}}
  .scanbox{background:#efe6d2;border:1px solid var(--line);border-radius:4px;padding:14px;
    box-shadow:var(--shadow)}
  .scanbox svg{width:100%;height:auto;display:block;border:1px solid #d8cbae;background:#f4ecd9}
  .scan-caption{font-family:var(--sans);font-size:11.5px;color:var(--ink-faint);margin-top:8px;text-align:center}
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;font-family:var(--sans);flex-wrap:wrap}
  .tabs button{font-size:12.5px;border:1px solid var(--line);border-bottom:none;background:var(--paper-deep);
    padding:6px 14px;cursor:pointer;border-radius:5px 5px 0 0;color:var(--ink-soft)}
  .tabs button.active{background:var(--card);font-weight:700;color:var(--accent)}
  .transcript{white-space:pre-wrap;font-size:15.5px;line-height:1.75}
  .transcript .unc{background:#f4e6c8;border-radius:2px;padding:0 2px;cursor:help}
  .transcript .mention{color:var(--accent);border-bottom:1px dotted var(--accent-soft);cursor:pointer}
  .note{font-family:var(--sans);font-size:12px;color:var(--ink-faint);background:var(--paper-deep);
    border-left:3px solid var(--gold);padding:8px 12px;border-radius:0 4px 4px 0;margin-top:14px}
  .timeline{list-style:none;border-left:2px solid var(--line);margin-left:8px;padding-left:26px}
  .timeline li{position:relative;margin-bottom:26px}
  .timeline li::before{content:'';position:absolute;left:-33px;top:6px;width:12px;height:12px;
    border-radius:50%;background:var(--accent);border:2px solid var(--paper)}
  .timeline .tl-date{font-family:var(--sans);font-size:12px;color:var(--gold);font-weight:700;
    text-transform:uppercase;letter-spacing:.08em}
  .timeline h4{font-weight:normal;font-size:17px}
  .timeline p{color:var(--ink-soft);font-size:14.5px}
  .tree-wrap{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px;
    box-shadow:var(--shadow);overflow-x:auto}
  .tree-wrap svg{min-width:700px;width:100%;height:auto}
  .tree-node rect{fill:var(--paper-deep);stroke:var(--line);rx:5}
  .tree-node.main rect{fill:#efe0de;stroke:var(--accent-soft)}
  .tree-node text{font-family:var(--sans);fill:var(--ink)}
  .tree-node{cursor:pointer}
  .tree-node:hover rect{stroke:var(--accent);stroke-width:2}
  .tree-line{stroke:var(--ink-faint);stroke-width:1.3;fill:none}
  .tree3{display:grid;gap:14px}
  .tree-mid{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:start}
  @media(max-width:860px){.tree-mid{grid-template-columns:1fr}}
  .tgroup{border:1px dashed var(--line);border-radius:8px;padding:10px 12px;background:rgba(255,255,255,.35)}
  .tlabel{font-family:var(--sans);font-size:11px;color:var(--ink-faint);text-transform:uppercase;
    letter-spacing:.1em;margin-bottom:8px;text-align:center}
  .crumbs{font-family:var(--sans);font-size:12.5px;color:var(--ink-faint)}
  .crumbs a{color:var(--accent-soft)}
  .elab{display:block;font-family:var(--sans);font-size:11px;color:var(--ink-faint);margin:10px 0 3px;
    text-transform:uppercase;letter-spacing:.06em}
  .ein{width:100%;font-family:var(--serif);font-size:14px;border:1px solid var(--line);border-radius:5px;
    padding:7px 9px;background:var(--paper);box-sizing:border-box}
  .result-block h3{font-size:15px;font-family:var(--sans);color:var(--ink-faint);
    text-transform:uppercase;letter-spacing:.1em;margin:22px 0 10px}
  mark{background:#f0dfae;padding:0 1px}
  .modal-back{position:fixed;inset:0;background:rgba(30,22,12,.45);display:flex;
    align-items:center;justify-content:center;z-index:100;padding:20px}
  .modal{background:var(--card);border-radius:8px;max-width:520px;padding:26px 28px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
  .modal h3{font-size:20px;font-weight:normal;margin-bottom:10px}
  .modal p{font-size:14.5px;color:var(--ink-soft);margin-bottom:10px}
  .modal textarea{width:100%;font-family:var(--serif);font-size:14px;border:1px solid var(--line);
    border-radius:5px;padding:10px;background:var(--paper);min-height:80px;margin:8px 0}
  .btn{font-family:var(--sans);font-size:13px;border:none;border-radius:16px;padding:8px 18px;
    cursor:pointer;background:var(--accent);color:#f6ecdd;font-weight:600}
  .btn.ghost{background:none;border:1px solid var(--line);color:var(--ink-soft)}
  .btn-row{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}
  .propose{font-family:var(--sans);font-size:12px;color:var(--ink-faint);border:1px dashed var(--line);
    background:none;border-radius:14px;padding:4px 12px;cursor:pointer}
  .propose:hover{color:var(--accent);border-color:var(--accent-soft)}
  .empty{color:var(--ink-faint);font-style:italic}
  footer{border-top:3px double var(--line);text-align:center;padding:26px;font-family:var(--sans);
    font-size:12px;color:var(--ink-faint)}
</style>
</head>
<body>
<div class="demo-banner" id="demoBanner"></div>
<header class="site">
  <div class="masthead">
    <div class="brand" onclick="go('home')">
      <h1 id="brandTitle">WESSLING FAMILIENARCHIV</h1>
      <span class="sub" id="brandSub"></span>
    </div>
    <div class="head-tools">
      <div class="search-wrap">
        <span class="icon">&#128269;</span>
        <input id="searchInput" type="text" onkeydown="if(event.key==='Enter')doSearch()">
      </div>
      <div class="lang-switch" id="langSwitch"></div>
      <button class="propose" title="Admin" onclick="adminToggle()">⚙</button>
    </div>
  </div>
  <nav class="main" id="mainNav"></nav>
</header>
<div id="adminBar"></div>
<main id="app"></main>
<footer id="footer"></footer>
<div id="modalHost"></div>
<script>
/* ============================================================
   WESSLING FAMILY ARCHIVE — interactive trilingual prototype.
   All content is FICTIONAL SAMPLE DATA illustrating structure.
   Data model mirrors the concept document (persons, sources,
   pages, events, tags, strands — each with de/en/pl fields).
   ============================================================ */
let LANG='de', VIEW={name:'home'};

const UI={
  demoBanner:{de:'Familienarchiv im Aufbau — Transkriptionen KI-erstellt, Prüfung durch die Familie läuft. [?] = unsichere Lesung.',
    en:'Family archive in progress — transcriptions AI-made, family review ongoing. [?] = uncertain reading.',
    pl:'Archiwum rodzinne w budowie — transkrypcje wykonane przez AI, trwa weryfikacja przez rodzinę. [?] = niepewny odczyt.'},
  brandSub:{de:'Chronik · Quellen · Personen',en:'Chronicle · Sources · People',pl:'Kronika · Źródła · Osoby'},
  brandTitle:{de:'WESSLING FAMILIENARCHIV',en:'WESSLING FAMILY ARCHIVE',pl:'ARCHIWUM RODZINY WESSLING'},
  nav:{home:{de:'Start',en:'Home',pl:'Start'},persons:{de:'Personen',en:'People',pl:'Osoby'},
    sources:{de:'Quellen',en:'Sources',pl:'Źródła'},timeline:{de:'Zeitleiste',en:'Timeline',pl:'Oś czasu'},
    tree:{de:'Stammbaum',en:'Family tree',pl:'Drzewo genealogiczne'},strands:{de:'Erzählstränge',en:'Narratives',pl:'Opowieści'},
    fragen:{de:'Fragen',en:'Ask',pl:'Pytania'},
    mappe:{de:'Sammelmappe',en:'Collection',pl:'Teczka'}},
  treeBack:{de:'Zurück',en:'Back',pl:'Wstecz'},
  mappeAdd:{de:'In die Sammelmappe',en:'Add to collection',pl:'Dodaj do teczki'},
  mappeEmpty:{de:'Die Sammelmappe ist leer. Auf Quellenseiten und Personenartikeln auf „In die Sammelmappe" klicken, um Dokumente und Artikel für den PDF-Export zusammenzustellen.',
    en:'The collection is empty. Click “Add to collection” on source pages and person articles to compile documents for PDF export.',
    pl:'Teczka jest pusta. Kliknij „Dodaj do teczki" na stronach źródeł i artykułach osób, aby zestawić dokumenty do eksportu PDF.'},
  mappePdf:{de:'PDF erstellen',en:'Create PDF',pl:'Utwórz PDF'},
  mappeHint:{de:'Es öffnet sich die Druckansicht — dort im Dialog „Als PDF speichern" wählen.',
    en:'A print view opens — choose “Save as PDF” in the dialog.',
    pl:'Otworzy się widok wydruku — w oknie wybierz „Zapisz jako PDF".'},
  mappeRemove:{de:'Entfernen',en:'Remove',pl:'Usuń'},
  mappeSub:{de:'Individuell zusammengestellte Dokumente und Artikel — Reihenfolge per Pfeil ändern, dann als PDF speichern.',
    en:'Individually compiled documents and articles — reorder with the arrows, then save as PDF.',
    pl:'Indywidualnie zestawione dokumenty i artykuły — zmień kolejność strzałkami, potem zapisz jako PDF.'},
  adminActive:{de:'Admin-Modus aktiv',en:'Admin mode active',pl:'Tryb administratora aktywny'},
  adminPrompt:{de:'Admin-Passwort:',en:'Admin password:',pl:'Hasło administratora:'},
  adminWrong:{de:'Falsches Passwort.',en:'Wrong password.',pl:'Błędne hasło.'},
  adminEdit:{de:'Bearbeiten',en:'Edit',pl:'Edytuj'},
  adminSave:{de:'Speichern',en:'Save',pl:'Zapisz'},
  adminEdits:{de:'Änderungen',en:'Edits',pl:'Zmiany'},
  adminExport:{de:'Daten exportieren',en:'Export data',pl:'Eksport danych'},
  adminImport:{de:'Daten importieren',en:'Import data',pl:'Import danych'},
  adminImported:{de:'Daten importiert.',en:'Data imported.',pl:'Dane zaimportowane.'},
  adminExpHint:{de:'Exportierte JSON-Datei in den OneDrive-Ordner legen oder an Claude senden — sie wird in die Masterdatei eingespielt.',
    en:'Place the exported JSON in the OneDrive folder or send it to Claude — it will be merged into the master file.',
    pl:'Umieść wyeksportowany plik JSON w folderze OneDrive lub wyślij do Claude — zostanie scalony z plikiem głównym.'},
  eName:{de:'Name',en:'Name',pl:'Imię i nazwisko'},
  eForms:{de:'Namensformen / Notiz',en:'Name forms / note',pl:'Formy nazwiska / notatka'},
  einTitle:{de:'Eingang — neue Quelle einreichen',en:'Intake — submit a new source',pl:'Wpływy — zgłoś nowe źródło'},
  einText:{de:'So kommt eine neue Quelle ins Archiv: 1) Scans (PDF/JPG, möglichst 300 dpi) in den OneDrive-Ordner „Family Archive/Content" legen. 2) Unten die Meldekarte ausfüllen und herunterladen — mit in den Ordner legen. 3) Claude transkribiert, übersetzt und verschlagwortet die Quelle in der nächsten Arbeitssitzung; danach erscheint sie hier im Archiv.',
    en:'How a new source enters the archive: 1) Place scans (PDF/JPG, ideally 300 dpi) in the OneDrive folder “Family Archive/Content”. 2) Fill in and download the intake card below — add it to the folder. 3) Claude transcribes, translates and indexes the source in the next working session; it then appears here in the archive.',
    pl:'Jak nowe źródło trafia do archiwum: 1) Umieść skany (PDF/JPG, najlepiej 300 dpi) w folderze OneDrive „Family Archive/Content". 2) Wypełnij i pobierz poniższą kartę zgłoszenia — dołącz ją do folderu. 3) Claude dokona transkrypcji, tłumaczenia i indeksacji w najbliższej sesji roboczej; źródło pojawi się w archiwum.'},
  einForm:{de:'Meldekarte ausfüllen …',en:'Fill in the intake card …',pl:'Wypełnij kartę zgłoszenia …'},
  einT1:{de:'Titel / Kurzbeschreibung',en:'Title / short description',pl:'Tytuł / krótki opis'},
  einT2:{de:'Typ (Brief, Tagebuch, Foto …)',en:'Type (letter, diary, photo …)',pl:'Typ (list, dziennik, zdjęcie …)'},
  einT3:{de:'Zeitraum / Datierung',en:'Period / dating',pl:'Okres / datowanie'},
  einT4:{de:'Herkunft (von wem, wie überliefert?)',en:'Provenance (from whom, how passed down?)',pl:'Pochodzenie (od kogo, jak przekazane?)'},
  einT5:{de:'Bemerkungen (erkannte Personen, Besonderheiten)',en:'Notes (recognised people, particulars)',pl:'Uwagi (rozpoznane osoby, szczegóły)'},
  einBtn:{de:'Meldekarte herunterladen',en:'Download intake card',pl:'Pobierz kartę zgłoszenia'},
  einWayA:{de:'Weg A — Archivleitung (Thomas)',en:'Route A — archive editor (Thomas)',pl:'Droga A — redaktor archiwum (Thomas)'},
  einWayB:{de:'Weg B — Familienmitglieder',en:'Route B — family members',pl:'Droga B — członkowie rodziny'},
  einFamText:{de:'1) Dokumente scannen oder bei gutem Tageslicht flach abfotografieren — jede Seite einzeln, möglichst scharf (ideal 300 dpi). 2) Unten die Meldekarte ausfüllen und herunterladen. 3) Scans und Meldekarte über den Upload-Link hochladen oder per E-Mail an die Archivleitung senden. Mehr ist nicht nötig — Transkription, Übersetzung und Einordnung übernimmt die Redaktion, und die Quelle erscheint hier im Archiv.',
    en:'1) Scan the documents or photograph them flat in good daylight — each page separately, as sharp as possible (ideally 300 dpi). 2) Fill in and download the intake card below. 3) Upload scans and card via the upload link, or send them by e-mail to the archive editor. Nothing more is needed — transcription, translation and indexing are done by the editorial side, and the source then appears here in the archive.',
    pl:'1) Zeskanuj dokumenty lub sfotografuj je na płasko w dobrym świetle — każdą stronę osobno, jak najostrzej (najlepiej 300 dpi). 2) Wypełnij i pobierz poniższą kartę zgłoszenia. 3) Prześlij skany i kartę przez link do przesyłania lub e-mailem do redaktora archiwum. Nic więcej nie trzeba — transkrypcją, tłumaczeniem i indeksowaniem zajmie się redakcja, a źródło pojawi się w archiwum.'},
  einUpload:{de:'Zum Upload-Link',en:'Open upload link',pl:'Link do przesyłania'},
  einMail:{de:'Per E-Mail senden',en:'Send by e-mail',pl:'Wyślij e-mailem'},
  searchPh:{de:'Archiv durchsuchen …',en:'Search the archive …',pl:'Przeszukaj archiwum …'},
  welcome:{de:'Willkommen im Familienarchiv',en:'Welcome to the family archive',pl:'Witamy w archiwum rodzinnym'},
  welcomeText:{de:'Briefe, Tagebücher, Alben und Dokumente der Familien Wessling, Adams, Peters, Ballin, Ganz und Mayer — transkribiert, übersetzt, verschlagwortet und miteinander verknüpft. Jede erwähnte Person ist nachschlagbar, jede Aussage belegt.',

<script>
/* ---------- APP LOGIC ---------- */
const t=o=>o?(o[LANG]!==undefined?o[LANG]:(o.de!==undefined?o.de:o)):'';
const P=id=>PERSONS.find(p=>p.id===id);
const S=id=>SOURCES.find(s=>s.id===id);
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const stripHtml=s=>s.replace(/<[^>]*>/g,' ');

function setLang(l){LANG=l;render();}
function go(name,id,extra){VIEW={name,id,extra};render();window.scrollTo(0,0);}

function renderTranscript(dipl){
  return esc(dipl)
    .replace(/&lt;m data-p="([a-z\-]+)"&gt;([\s\S]*?)&lt;\/m&gt;/g,
      (_,p,txt)=>`<span class="mention" onclick="go('person','${p}')">${txt}</span>`)
    .replace(/&lt;u title="([^"]*)"&gt;([\s\S]*?)&lt;\/u&gt;/g,
      (_,ti,txt)=>`<span class="unc" title="${ti}">${txt}</span>`);
}
function mentionsOf(pid){
  const out=[];
  SOURCES.forEach(s=>s.pages.forEach(pg=>{
    if(pg.dipl.includes(`data-p="${pid}"`)){
      const sent=t(pg.read).split(/(?<=[.!?])\s+/).find(x=>true);
      out.push({src:s,page:pg.n,label:pg.label,snippet:t(pg.read).slice(0,140)+'…'});
    }
  }));
  return out;
}
function chipTags(tags){return tags.map(tg=>`<span class="chip" onclick="go('tag','${tg}')">${t(TAGS[tg])}</span>`).join('');}
function chipStrands(arr){return arr.map(st=>`<span class="chip strand" onclick="go('persons',null,'${st}')">${t(STRANDS[st])}</span>`).join('');}
function statusBadge(st){const m={done:'ok',review:'rough',rough:'rough'};return `<span class="badge ${m[st]||'rough'}">${t(UI.statusMap[st])}</span>`;}

/* ---------- views ---------- */
function vHome(){
  return `<div class="hero">
    <div class="welcome"><h2 class="page">${t(UI.welcome)}</h2><p>${t(UI.welcomeText)}</p>
      <div class="chips" style="margin-top:16px">${chipTags(Object.keys(TAGS))}</div></div>
    <div><h3 style="font-weight:normal;margin-bottom:10px">${t(UI.strandsTitle)}</h3>
      <div class="strand-list">${Object.keys(STRANDS).map(st=>{
        const n=PERSONS.filter(p=>p.strand.includes(st)).length;
        return `<div class="strand-row" onclick="go('persons',null,'${st}')"><b>${t(STRANDS[st])}</b><span>${n} ${t(UI.inPersons)}</span></div>`;}).join('')}
      </div></div></div>
    <h3 style="font-weight:normal;margin-bottom:12px">${t(UI.recent)}</h3>
    <div class="grid cols3">${SOURCES.map(cardSource).join('')}</div>`;
}
function cardSource(s){
  return `<div class="card"><div class="meta"><span class="badge type">${t(s.type)}</span> &nbsp;${s.sig} &nbsp;·&nbsp; ${s.date} &nbsp;${statusBadge(s.status)}</div>
    <h3><a onclick="go('source','${s.id}')">${t(s.title)}</a></h3>
    <p style="font-size:14px;color:var(--ink-soft)">${t(s.summary)}</p>
    <div class="chips">${chipTags(s.tags)}</div></div>`;
}
function cardPerson(p){
  const dates=(p.born!=='?'?`${t(UI.born)} ${p.born}`:'')+(p.died&&p.died!=='?'?` · ${t(UI.died)} ${p.died}`:'');
  return `<div class="card"><div class="meta">${dates||'—'} &nbsp;<span class="badge ${p.status==='ident'?'ok':'open'}">${t(p.status==='ident'?UI.stIdent:UI.stOpen)}</span>${p.living?` <span class="badge rough">${t(UI.stLiving)}</span>`:''}</div>
    <h3><a onclick="go('person','${p.id}')">${p.name}</a></h3>
    <div class="meta">${p.nameForms}</div>
    <div class="chips">${chipStrands(p.strand)}${p.circle==='freunde'?`<span class="chip strand" onclick="go('persons',null,'freunde')">☕ ${t(UI.circleFriends)}</span>`:''}</div></div>`;
}
function vPersons(filter){
  const list=filter==='freunde'?PERSONS.filter(p=>p.circle==='freunde')
    :filter?PERSONS.filter(p=>p.strand.includes(filter)):PERSONS;
  return `<h2 class="page">${t(UI.nav.persons)}</h2><div class="page-sub">${t(UI.personsSub)} (${list.length})</div>
    <div class="filterbar"><button class="${!filter?'active':''}" onclick="go('persons')">${t(UI.all)}</button>
    ${Object.keys(STRANDS).map(st=>`<button class="${filter===st?'active':''}" onclick="go('persons',null,'${st}')">${t(STRANDS[st])}</button>`).join('')}
    <button class="${filter==='freunde'?'active':''}" onclick="go('persons',null,'freunde')">☕ ${t(UI.circleFriends)}</button></div>
    <div class="grid cols3">${list.map(cardPerson).join('')}</div>`;
}
function vPerson(id){
  const p=P(id); if(!p) return '<p class="empty">?</p>';
  const men=mentionsOf(id);
  return `<a class="backlink" onclick="go('persons')">← ${t(UI.nav.persons)}</a>
  <div class="detail-head"><div><h2 class="page">${p.name}</h2>
    <div class="page-sub">${p.nameForms} &nbsp;<span class="badge ${p.status==='ident'?'ok':'open'}">${t(p.status==='ident'?UI.stIdent:UI.stOpen)}</span>${p.living?` <span class="badge rough">${t(UI.stLiving)}</span>`:''}</div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="propose" onclick="mappeAdd('person','${p.id}')">🗂 ${t(UI.mappeAdd)}</button>
      ${ADMIN?`<button class="propose" onclick="editPerson('${p.id}')">🛠 ${t(UI.adminEdit)}</button>`:''}
      <button class="propose" onclick="openModal()">✎ ${t(UI.propose)}</button></div></div>
  <div class="person-layout"><div>
    <h3 style="font-weight:normal;margin-bottom:8px">${t(UI.article)}</h3>
    <div class="prose">${t(p.bio)||`<p><i>${t(UI.gedAutoBio).replace('[Q-GED-01]','<a class="cite" onclick="go(&quot;source&quot;,&quot;q-ged&quot;)">[Q-GED-01]</a>')}</i></p>`}</div><hr class="rule">
    <h3 style="font-weight:normal;margin-bottom:10px">${t(UI.mentions)}</h3>
    ${men.length?`<ul class="mention-list">${men.map(m=>`<li><a onclick="go('source','${m.src.id}')">${t(m.src.title)}</a> — ${m.label||t(UI.page)+' '+m.page}<br><span class="snippet">„${m.snippet}"</span></li>`).join('')}</ul>`:`<p class="empty">—</p>`}
    ${(window.PHOTOS||[]).some(ph=>ph.persons.includes(p.id))?`<hr class="rule"><h3 style="font-weight:normal;margin-bottom:10px">${t(UI.photos)}</h3><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px">${PHOTOS.filter(ph=>ph.persons.includes(p.id)).map(ph=>`<figure style="margin:0;cursor:pointer" onclick="openPhoto('${ph.k}')"><img src="${IMGS[ph.k]}" loading="lazy" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:4px;border:1px solid var(--line)"><figcaption class="meta" style="margin-top:3px">${ph.cap}</figcaption></figure>`).join('')}</div>`:''}
  </div><aside>
    ${(p.img&&typeof IMGS!=='undefined'&&IMGS[p.img])?`<img src="${IMGS[p.img]}" style="width:100%;border-radius:4px;border:1px solid var(--line);margin-bottom:12px;cursor:pointer" onclick="openPhoto('${p.img}')">`:`<div class="portrait">${t(UI.portraitPh)}</div>`}
    <div class="factbox"><b style="font-size:12px;text-transform:uppercase;letter-spacing:.1em">${t(UI.factsTitle)}</b><dl>
      <dt>${t(UI.fNames)}</dt><dd>${p.nameForms}</dd>
      <dt>${t(UI.fDates)}</dt><dd>${t(UI.born)} ${p.born} · ${t(UI.died)} ${p.died}</dd>
      <dt>${t(UI.fStrand)}</dt><dd><div class="chips">${chipStrands(p.strand)}</div></dd>
      ${p.rel.length?`<dt>${t(UI.fRel)}</dt><dd>${p.rel.map(r=>P(r[0])?`<a onclick="go('person','${r[0]}')">${P(r[0]).name}</a> <span style="color:var(--ink-faint)">${r[1]}</span>`:'').join('<br>')}</dd>`:''}
    </dl></div>
    ${famBoxHtml(p.id)}</aside></div>`;
}
function famBoxHtml(id){
  const r=window.RELX&&RELX[id]; if(!r||(!r.par.length&&!r.spo.length&&!r.chi.length&&!r.sib.length)) return '';
  const li=ids=>ids.map(i=>P(i)?`<a onclick="go('person','${i}')">${P(i).name}</a>`:'').filter(Boolean).join(' · ');
  const row=(lbl,ids)=>ids.length&&li(ids)?`<dt>${lbl}</dt><dd>${li(ids)}</dd>`:'';
  return `<div class="factbox" style="margin-top:12px"><b style="font-size:12px;text-transform:uppercase;letter-spacing:.1em">${t(UI.famBox)}</b><dl>
    ${row(t(UI.fam.parents),r.par)}${row(t(UI.fam.spouses),r.spo)}${row(t(UI.fam.siblings),r.sib)}${row(t(UI.fam.children),r.chi)}</dl>
    <div style="margin-top:8px"><a onclick="go('tree','${id}')" style="font-size:12.5px">→ ${t(UI.nav.tree)}</a></div></div>`;
}
function vSources(){
  return `<h2 class="page">${t(UI.nav.sources)}</h2><div class="page-sub">${t(UI.sourcesSub)}</div>
    <div class="card" style="border-left:5px solid var(--gold);margin-bottom:22px">
      <h3>📥 ${t(UI.einTitle)}</h3>
      <div class="meta" style="margin-top:10px">${t(UI.einWayB)}</div>
      <p style="font-size:14px;color:var(--ink-soft);margin:4px 0 8px">${t(UI.einFamText)}</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px">
        ${(window.INTAKE&&INTAKE.uploadUrl)?`<a class="btn" style="text-decoration:none" href="${INTAKE.uploadUrl}" target="_blank" rel="noopener">⬆ ${t(UI.einUpload)}</a>`:''}
        ${(window.INTAKE&&INTAKE.email)?`<a class="btn ghost" style="text-decoration:none" href="mailto:${INTAKE.email}?subject=Quellenmeldung%20Familienarchiv">✉ ${t(UI.einMail)}</a>`:''}
      </div>
      <div class="meta">${t(UI.einWayA)}</div>
      <p style="font-size:14px;color:var(--ink-soft);margin:4px 0 8px">${t(UI.einText)}</p>
      <details><summary style="cursor:pointer;font-family:var(--sans);font-size:13px;color:var(--accent)">${t(UI.einForm)}</summary>
        <div style="max-width:560px">
          ${efield('q_title',UI.einT1,'')}${efield('q_type',UI.einT2,'')}${efield('q_date',UI.einT3,'')}
          ${efield('q_prov',UI.einT4,'')}${earea('q_note',UI.einT5,'',3)}
          <div style="margin-top:12px"><button class="btn" onclick="einDownload()">⬇ ${t(UI.einBtn)}</button></div>
        </div></details></div>
    <div class="grid cols3">${SOURCES.map(cardSource).join('')}</div>`;
}
function fakeScan(){
  let lines='';
  for(let i=0;i<9;i++){const y=34+i*18;const w=60+((i*37)%25);
    lines+=`<path d="M22 ${y} q ${w/3} -4 ${w} 0 q ${w/2.6} 4 ${w*1.6} -1" stroke="#6d5b3f" stroke-width="1.1" fill="none" opacity="${0.55+(i%3)*0.12}"/>`;}
  return `<svg viewBox="0 0 220 220" role="img" aria-label="Faksimile-Platzhalter">
    <rect x="6" y="6" width="208" height="208" fill="#f6efdc" stroke="#dccfae"/>
    <path d="M14 12 l 4 200" stroke="#e4d7b6" stroke-width="3"/>${lines}
    <text x="110" y="205" text-anchor="middle" font-size="7" fill="#a3906d" font-family="sans-serif">— ${t(UI.scanPh)} —</text></svg>`;
}
function vSource(id,extra){
  const s=S(id); if(!s) return '<p class="empty">?</p>';

    <div class="page-sub"><span class="badge type">${t(s.type)}</span> &nbsp;${statusBadge(s.status)} &nbsp; ${s.sig} · ${s.date}</div></div></div>

let TH=[];
function treeGo(id){

  go('tree',id);
}
function treeBack(){go('tree',TH.pop()||'thomas');}
function treeJump(i){const target=TH[i];TH=TH.slice(0,i);go('tree',target);}
function treeCard(id,big){

function vTree(focus){

function hl(text,q){
  const i=text.toLowerCase().indexOf(q.toLowerCase()); if(i<0)return esc(text.slice(0,150));
  const a=Math.max(0,i-60);
  return (a>0?'… ':'')+esc(text.slice(a,i))+'<mark>'+esc(text.slice(i,i+q.length))+'</mark>'+esc(text.slice(i+q.length,i+q.length+90))+' …';
}
function vSearch(q){
  const ql=q.toLowerCase();
  const pHits=PERSONS.filter(p=>(p.name+' '+p.nameForms+' '+stripHtml(t(p.bio))).toLowerCase().includes(ql));
  const sHits=[];
  SOURCES.forEach(s=>{
    let hay=t(s.title)+' '+t(s.summary)+' '+s.sig;
    s.pages.forEach(pg=>{hay+=' '+stripHtml(pg.dipl)+' '+pg.read.de+' '+pg.read.en+' '+pg.read.pl;});
    if(hay.toLowerCase().includes(ql))sHits.push({s,hay});
  });
  const eHits=EVENTS.filter(e=>(t(e.title)+' '+t(e.text)).toLowerCase().includes(ql));
  const none=!pHits.length&&!sHits.length&&!eHits.length;
  return `<h2 class="page">${t(UI.results)} „${esc(q)}"</h2><div class="page-sub"></div>
  ${none?`<p class="empty">${t(UI.noResults)}</p>`:''}
  ${pHits.length?`<div class="result-block"><h3>${t(UI.inPersons)}</h3><div class="grid cols3">${pHits.map(cardPerson).join('')}</div></div>`:''}
  ${sHits.length?`<div class="result-block"><h3>${t(UI.inSources)}</h3>${sHits.map(h=>`<div class="card" style="margin-bottom:12px"><h3><a onclick="go('source','${h.s.id}')">${t(h.s.title)}</a></h3><p style="font-size:14px;color:var(--ink-soft)">${hl(h.hay,q)}</p></div>`).join('')}</div>`:''}
  ${eHits.length?`<div class="result-block"><h3>${t(UI.inEvents)}</h3><ul class="timeline">${eHits.map(e=>`<li><div class="tl-date">${e.date}</div><h4>${t(e.title)}</h4><p>${t(e.text)}</p></li>`).join('')}</ul></div>`:''}`;
}

function dataImport(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
  inp.onchange=()=>{const r=new FileReader();r.onload=()=>{try{
      const d=JSON.parse(r.result);
      if(d.persons){PERSONS.length=0;PERSONS.push(...d.persons);}
      if(d.sources){SOURCES.length=0;SOURCES.push(...d.sources);}
      if(d.events){EVENTS.length=0;EVENTS.push(...d.events);}
      if(d.narratives){NARRATIVES.length=0;NARRATIVES.push(...d.narratives);}
      alert(t(UI.adminImported));render();
    }catch(e){alert('Import: '+e.message);}};
    r.readAsText(inp.files[0]);};
  inp.click();
}

/* ---------- E1: Frag das Archiv (Offline-Assistent) ---------- */
let QALOG=[];
const STOPTOK=['wessling','adams','peters','ballin','ganz','mayer','wann','wurde','geboren','gestorben','was','wer','wie','welche','briefe','brief'];
function qaMatchPersons(ql){
  const res=[];
  for(const p of PERSONS){
    const toks=(p.name+' '+(p.nameForms||'')).toLowerCase()
      .replace(/[„“”"()\[\],.;:!?]/g,' ').split(/\s+/)
      .filter(w=>w.length>=4&&!STOPTOK.includes(w));
    let best=0;
    for(const tk of toks){ if(ql.includes(tk)) best=Math.max(best,tk.length); }
    if(best) res.push([best,p]);
  }
  res.sort((a,b)=>b[0]-a[0]);
  const seen=new Set(), out=[];
  for(const [s,p] of res){ if(!seen.has(p.id)){seen.add(p.id);out.push(p);} if(out.length>=3)break; }
  return out;
}
function qaPersonBlock(p){
  const dates=(p.born&&p.born!=='?'?t(UI.born)+' '+p.born+(p.bornp?' — '+p.bornp:''):'')+
    (p.died?'<br>'+t(UI.died)+' '+p.died+(p.diedp?' — '+p.diedp:''):'');
  const r=window.RELX&&RELX[p.id];
  const rel=r?[[UI.fam.parents,r.par],[UI.fam.spouses,r.spo],[UI.fam.children,r.chi]]
    .filter(x=>x[1].length)
    .map(x=>`${t(x[0])}: ${x[1].slice(0,6).map(i=>P(i)?`<a onclick="go('person','${i}')">${P(i).name}</a>`:'').filter(Boolean).join(', ')}`)
    .join('<br>'):'';
  const men=mentionsOf(p.id);
  return `<div style="display:flex;gap:12px;align-items:flex-start">
   ${(p.img&&IMGS[p.img])?`<img src="${IMGS[p.img]}" style="width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--line)">`:''}
   <div><b><a onclick="go('person','${p.id}')">${p.name}</a></b>${p.living?` <span class="badge rough">${t(UI.stLiving)}</span>`:''}
   <div class="meta" style="margin:3px 0">${dates||p.nameForms||'—'}</div>
   ${rel?`<div style="font-size:13px;font-family:var(--sans)">${rel}</div>`:''}
   ${men.length?`<div class="meta" style="margin-top:5px">${t(UI.qaMentions)}: ${men.slice(0,4).map(m=>`<a onclick="go('source','${m.src.id}')">${m.src.sig}</a>`).join(' · ')}</div>`:''}
   <div style="margin-top:5px;font-family:var(--sans);font-size:12.5px"><a onclick="go('person','${p.id}')">${t(UI.openArticle)} →</a> &nbsp; <a onclick="go('tree','${p.id}')">${t(UI.nav.tree)} →</a></div>
   </div></div>`;
}
function qaAnswer(q){
  const ql=' '+q.toLowerCase()+' ';
  const parts=[];
  const pers=qaMatchPersons(ql);
  pers.forEach(p=>parts.push(qaPersonBlock(p)));
  const years=[...new Set((q.match(/\b(1[5-9]\d\d|20\d\d)\b/g)||[]))];
  for(const y of years){
    const evs=EVENTS.filter(ev=>String(ev.date).startsWith(y)||t(ev.title).includes(y)||t(ev.text).includes(y));
    const srcs=SOURCES.filter(s=>String(s.date).includes(y));
    if(evs.length) parts.push(`<div class="meta" style="margin-bottom:4px">${t(UI.qaEvents)} ${y}:</div>`+
      evs.map(ev=>`<div style="margin-bottom:6px"><b>${t(ev.title)}</b><br><span style="font-size:13.5px">${t(ev.text)}</span> <span class="meta">${ev.sources.map(sid=>S(sid)?`<a onclick="go('source','${sid}')">${S(sid).sig}</a>`:'').join(' ')}</span></div>`).join(''));
    if(srcs.length) parts.push(`<div class="meta" style="margin:4px 0">${t(UI.qaSources)} (${y}):</div>`+
      srcs.map(s=>`<div>• <a onclick="go('source','${s.id}')">${t(s.title)}</a></div>`).join(''));
  }
  const tagHits=Object.keys(TAGS).filter(tg=>['de','en','pl'].some(l=>{
    const lab=(TAGS[tg][l]||'').toLowerCase(); return lab.length>=4&&ql.includes(lab.split(' ')[0]);
  }));
  for(const tg of tagHits.slice(0,2)){
    const srcs=SOURCES.filter(s=>s.tags&&s.tags.includes(tg));
    if(srcs.length) parts.push(`<div class="meta" style="margin:4px 0">${t(UI.taggedWith)} „${t(TAGS[tg])}":</div>`+
      srcs.map(s=>`<div>• <a onclick="go('source','${s.id}')">${t(s.title)}</a></div>`).join(''));
  }
  if(!parts.length){
    const hits=[];
    SOURCES.forEach(s=>{let hay=t(s.title)+' '+t(s.summary);
      s.pages.forEach(pg=>{hay+=' '+pg.read.de+' '+(pg.read[LANG]||'');});
      if(hay.toLowerCase().includes(q.toLowerCase())) hits.push({s,hay});});
    if(hits.length) parts.push(`<div class="meta" style="margin-bottom:4px">${t(UI.qaFallback)}</div>`+
      hits.slice(0,4).map(h=>`<div style="margin-bottom:6px"><a onclick="go('source','${h.s.id}')">${t(h.s.title)}</a><br><span style="font-size:13px">${hl(h.hay,q)}</span></div>`).join(''));
  }
  if(!parts.length) parts.push(`<span style="font-size:14px">${t(UI.qaNothing)}</span>`);
  return parts.join('<hr class="rule" style="margin:10px 0">');
}
function qaBubble(m,i){
  if(m.who==='u') return `<div style="text-align:right;margin:12px 0"><span style="display:inline-block;background:var(--accent);color:#f6ecdd;border-radius:14px 14px 2px 14px;padding:8px 14px;font-family:var(--sans);font-size:14px;max-width:80%;text-align:left">${m.html}</span></div>`;
  const ai=(window.AICFG&&AICFG.endpoint)?`<div style="margin-top:8px"><button class="propose" onclick="qaAI(${i})">🤖 ${t(UI.qaAI)}</button><div id="aislot${i}"></div></div>`:'';
  return `<div style="margin:12px 0"><div class="card" style="border-left:4px solid var(--gold)">${m.html}${ai}</div></div>`;
}
function qaAsk(q){
  const inp=document.getElementById('qaIn');
  q=q||(inp?inp.value.trim():''); if(!q)return;
  QALOG.push({who:'u',html:esc(q),q});
  QALOG.push({who:'a',html:qaAnswer(q),q});
  if(QALOG.length>40)QALOG=QALOG.slice(-40);
  render();
  window.scrollTo(0,document.body.scrollHeight);
  const inp2=document.getElementById('qaIn'); if(inp2){inp2.value='';inp2.focus();}
}
function qaContext(q){
  let ctx='';
  const add=s=>{if(ctx.length<7000)ctx+=s+'\n';};
  qaMatchPersons(' '+q.toLowerCase()+' ').forEach(p=>{
    add(p.name+' | '+(p.born||'')+' '+(p.bornp||'')+' | '+(p.died||'')+' '+(p.diedp||''));
    if(p.bio)add(stripHtml(t(p.bio)).slice(0,900));
  });
  SOURCES.forEach(s=>{let hay=(t(s.title)+' '+t(s.summary)).toLowerCase();
    const qtoks=q.toLowerCase().split(/\s+/).filter(w=>w.length>=4);
    if(qtoks.some(w=>hay.includes(w))){add(t(s.title)+': '+t(s.summary));}
    s.pages.forEach(pg=>{ if(qtoks.some(w=>pg.read.de.toLowerCase().includes(w))) add(pg.read.de.slice(0,900)); });
  });
  return ctx.slice(0,8000);
}
async function qaAI(i){
  const m=QALOG[i]; if(!m)return;
  const el=document.getElementById('aislot'+i); if(!el)return;
  el.innerHTML=`<div class="meta" style="margin-top:6px">${t(UI.qaAIWait)}</div>`;
  try{
    const r=await fetch(AICFG.endpoint,{method:'POST',
      headers:{'Content-Type':'application/json','X-Archive-Token':AICFG.token||''},
      body:JSON.stringify({question:m.q,lang:LANG,context:qaContext(m.q)})});
    if(!r.ok)throw new Error(r.status);
    const j=await r.json();
    el.innerHTML=`<div style="margin-top:8px;background:var(--paper-deep);border-radius:6px;padding:10px 12px;font-size:14px">🤖 ${esc(j.answer||'')}</div>`;
  }catch(err){ el.innerHTML=`<div class="meta" style="margin-top:6px">${t(UI.qaAIErr)}</div>`; }
}
function vAsk(){
  const ex={de:['Wer war Irene?','Wann wurde Fredi Durra geboren?','Was geschah 1943?','Poesiealbum'],
    en:['Who was Irene?','When was Fredi Durra born?','What happened in 1943?','Friendship album'],
    pl:['Kim była Irene?','Kiedy urodził się Fredi Durra?','Co wydarzyło się w 1943?','Sztambuch']}[LANG]||[];
  return `<h2 class="page">${t(UI.qaTitle)}</h2><div class="page-sub">${t(UI.qaSub)}</div>
  <div class="filterbar">${ex.map(q=>`<button onclick="qaAsk('${q.replace(/'/g,"\\'")}')">${q}</button>`).join('')}</div>
  <div id="qalog">${QALOG.map((m,i)=>qaBubble(m,i)).join('')}</div>
  <div style="display:flex;gap:8px;margin-top:16px;position:sticky;bottom:12px">
    <input id="qaIn" class="ein" style="flex:1;background:var(--card)" placeholder="${t(UI.qaPh)}" onkeydown="if(event.key==='Enter')qaAsk()">
    <button class="btn" onclick="qaAsk()">${t(UI.qaAsk)}</button></div>`;
}

/* ---------- Sammelmappe (PDF-Export) ---------- */
let MAPPE=[];
function mappeAdd(kind,a,b){
  const key=kind+':'+a+':'+(b??'');
  if(!MAPPE.some(x=>x.key===key)) MAPPE.push({key,kind,a,b});
  render();
}
function mappeRemove(i){MAPPE.splice(i,1);render();}
function mappeMove(i,d){const j=i+d;if(j<0||j>=MAPPE.length)return;[MAPPE[i],MAPPE[j]]=[MAPPE[j],MAPPE[i]];render();}
function mappeTitle(it){
  if(it.kind==='person'){const p=P(it.a);return p?p.name:it.a;}
  const s=S(it.a);if(!s)return it.a;const pg=s.pages[it.b];
  return `${t(s.title)} — ${pg?(pg.label||t(UI.page)+' '+pg.n):''}`;
}
function vMappe(){
  if(!MAPPE.length) return `<h2 class="page">${t(UI.nav.mappe)}</h2><div class="page-sub">${t(UI.mappeSub)}</div><p class="empty">${t(UI.mappeEmpty)}</p>`;
  return `<h2 class="page">${t(UI.nav.mappe)}</h2><div class="page-sub">${t(UI.mappeSub)}</div>
  ${MAPPE.map((it,i)=>`<div class="card" style="margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
    <div style="font-size:15px"><b>${i+1}.</b> ${mappeTitle(it)}</div>
    <div style="display:flex;gap:6px;font-family:var(--sans)">
      <button class="propose" onclick="mappeMove(${i},-1)">↑</button>
      <button class="propose" onclick="mappeMove(${i},1)">↓</button>
      <button class="propose" onclick="mappeRemove(${i})">✕ ${t(UI.mappeRemove)}</button>
    </div></div>`).join('')}
  <div style="margin-top:18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap">
    <button class="btn" onclick="mappePrint()">⬇ ${t(UI.mappePdf)}</button>
    <span class="meta" style="margin:0">${t(UI.mappeHint)}</span></div>`;
}
function stripClicks(html){return (html||'').replace(/ onclick="[^"]*"/g,'');}
function mappePrint(){
  const items=MAPPE.map(it=>{
    if(it.kind==='person'){
      const p=P(it.a);if(!p)return '';
      const dates=(p.born&&p.born!=='?'?'*'+p.born:'')+(p.died?' · †'+p.died:'');
      return `<section><h2>${p.name}</h2><div class="m">${dates||''} ${p.bornp?'· *'+p.bornp:''}</div>${stripClicks(t(p.bio))||'<p><i>'+t(UI.gedAutoBio)+'</i></p>'}</section>`;
    }
    const s=S(it.a);if(!s)return '';const pg=s.pages[it.b];if(!pg)return '';
    const diplClean=esc(pg.dipl.replace(/<\/?(m|u)[^>]*>/g,''));
    const tr=(LANG!=='de'&&pg.read[LANG])?`<h4>${LANG==='en'?t(UI.tabEN):t(UI.tabPL)}</h4><p>${pg.read[LANG]}</p>`:'';
    return `<section><h2>${t(s.title)}</h2><div class="m">${s.sig} · ${pg.label||t(UI.page)+' '+pg.n} · ${s.date}</div>
      ${(typeof IMGS!=='undefined'&&pg.img&&IMGS[pg.img])?`<img src="${IMGS[pg.img]}">`:''}
      <h4>${t(UI.tabDipl)}</h4><pre>${diplClean}</pre>
      <h4>${t(UI.tabRead)}</h4><p>${pg.read.de}</p>${tr}</section>`;
  }).join('');
  const w=window.open('','_blank');
  if(!w){alert('Popup blockiert — bitte Popups für diese Datei erlauben.');return;}
  w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>${t(UI.brandTitle)}</title><style>
   body{font-family:Georgia,serif;color:#222;max-width:720px;margin:24px auto;line-height:1.55;padding:0 16px}
   h1{font-size:19px;letter-spacing:.12em;border-bottom:2px solid #999;padding-bottom:8px}
   h2{font-size:19px;margin:0 0 2px}
   h4{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:#8a6d1f;margin:14px 0 4px}
   .m{font-size:12px;color:#777;font-family:sans-serif;margin-bottom:8px}
   section{page-break-inside:avoid;border-bottom:1px solid #ddd;padding:18px 0}
   pre{white-space:pre-wrap;font-family:Georgia,serif;font-size:14px;background:#f6f2e8;padding:10px;border-radius:4px}
   img{max-width:45%;float:right;margin:0 0 10px 14px;border:1px solid #ccc}
   section::after{content:"";display:block;clear:both}
   .cite{font-size:10px;vertical-align:super;color:#8a6d1f}
   @media print{body{margin:8mm;max-width:none}}
  </style></head><body><h1>${t(UI.brandTitle)}</h1>${items}
  <p style="font-size:11px;color:#999;font-family:sans-serif">${t(UI.demoBanner)}</p></body></html>`);
  w.document.close();
  setTimeout(()=>{try{w.focus();w.print();}catch(e){}},500);
}

  document.getElementById('langSwitch').innerHTML=['de','en','pl'].map(l=>

    : v.name==='fragen'?vAsk()
    : v.name==='mappe'?vMappe()
    : vHome();
}
