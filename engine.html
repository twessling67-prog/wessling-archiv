<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Wessling Familienarchiv · Wessling Family Archive</title>
<style>
  :root{
    --paper:#f6f1e7; --paper-deep:#efe7d7; --card:#fdfaf3;
    --ink:#2e2418; --ink-soft:#5c4f3d; --ink-faint:#8a7c66;
    --accent:#7d2e2a; --accent-soft:#a2554f; --gold:#9a7b2f;
    --line:#d9cdb8; --ok:#3f6b45; --warn:#8a6d1f;
    --shadow:0 1px 3px rgba(46,36,24,.10), 0 6px 18px rgba(46,36,24,.07);
    --serif:'Iowan Old Style','Palatino Linotype','Book Antiqua',Palatino,Georgia,serif;
    --sans:'Segoe UI',system-ui,-apple-system,sans-serif;
    --f-wessling:#7d2e2a; --f-adams:#2e5f5c; --f-peters:#8a6d2f;
    --f-ballin:#5c3a54; --f-ganz:#3d5a3c; --f-mayer:#7a5540;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--serif);line-height:1.6}
  a{color:var(--accent);cursor:pointer;text-decoration:none}
  a:hover{text-decoration:underline}
  .demo-banner{background:#3a2f1f;color:#e8dcc4;font-family:var(--sans);font-size:12.5px;
    text-align:center;padding:6px 12px;letter-spacing:.02em}
  header.site{background:var(--card);border-bottom:3px double var(--line);padding:18px 28px 0;
    position:sticky;top:0;z-index:50;box-shadow:0 2px 10px rgba(46,36,24,.06)}
  .masthead{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:10px}
  .brand{display:flex;align-items:baseline;gap:14px;cursor:pointer}
  .brand h1{font-size:20px;font-weight:normal;letter-spacing:.16em}
  .brand h1 .amp{color:var(--accent);font-style:italic}
  .brand .sub{font-family:var(--sans);font-size:11.5px;color:var(--ink-faint);
    text-transform:uppercase;letter-spacing:.18em}
  .head-tools{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .search-wrap{position:relative}
  .search-wrap input{font-family:var(--sans);font-size:13.5px;padding:7px 12px 7px 32px;
    border:1px solid var(--line);border-radius:18px;background:var(--paper);color:var(--ink);
    width:250px;outline:none}
  .search-wrap input:focus{border-color:var(--accent-soft)}
  .search-wrap .icon{position:absolute;left:11px;top:7px;color:var(--ink-faint);font-size:13px}
  .lang-switch{display:flex;border:1px solid var(--line);border-radius:16px;overflow:hidden;
    font-family:var(--sans);font-size:12.5px}
  .lang-switch button{border:none;background:var(--paper);color:var(--ink-soft);padding:6px 13px;
    cursor:pointer;font-weight:600;letter-spacing:.04em}
  .lang-switch button.active{background:var(--accent);color:#f6ecdd}
  nav.main{display:flex;gap:4px;margin-top:12px;flex-wrap:wrap}
  nav.main button{font-family:var(--sans);font-size:13.5px;border:none;background:none;
    color:var(--ink-soft);padding:9px 15px;cursor:pointer;border-bottom:3px solid transparent}
  nav.main button:hover{color:var(--accent)}
  nav.main button.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
  main{max-width:1100px;margin:0 auto;padding:30px 24px 80px}
  h2.page{font-size:30px;font-weight:normal;margin-bottom:6px}
  .page-sub{font-family:var(--sans);color:var(--ink-faint);font-size:13.5px;margin-bottom:26px}
  .rule{border:none;border-top:1px solid var(--line);margin:22px 0}
  .grid{display:grid;gap:18px}
  .grid.cols3{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
  .grid.cols2{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
  .card{background:var(--card);border:1px solid var(--line);border-radius:6px;
    padding:18px 20px;box-shadow:var(--shadow)}
  .card h3{font-size:18px;font-weight:normal;margin-bottom:4px}
  .card h3 a{color:var(--ink)} .card h3 a:hover{color:var(--accent)}
  .meta{font-family:var(--sans);font-size:12px;color:var(--ink-faint);margin-bottom:8px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .chip{font-family:var(--sans);font-size:11.5px;background:var(--paper-deep);
    border:1px solid var(--line);border-radius:12px;padding:2px 10px;color:var(--ink-soft);cursor:pointer}
  .chip:hover{border-color:var(--accent-soft);color:var(--accent)}
  .chip.strand{background:#ece2f0;border-color:#cbb8d6;color:#5b3a6e}
  .badge{font-family:var(--sans);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;
    border-radius:3px;padding:2px 7px;font-weight:700}
  .badge.ok{background:#e2ecdf;color:var(--ok)}
  .badge.rough{background:#f2e8cf;color:var(--warn)}
  .badge.open{background:#f0dede;color:var(--accent)}
  .badge.type{background:var(--paper-deep);color:var(--ink-soft)}
  .hero{display:grid;grid-template-columns:1.4fr 1fr;gap:26px;margin-bottom:30px}
  @media(max-width:800px){.hero{grid-template-columns:1fr}}
  .hero .welcome{background:var(--card);border:1px solid var(--line);border-radius:6px;
    padding:26px 28px;box-shadow:var(--shadow)}
  .hero .welcome p{margin-top:10px;color:var(--ink-soft)}
  .strand-list{display:flex;flex-direction:column;gap:10px}
  .strand-row{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--accent);
    border-radius:4px;padding:10px 16px;cursor:pointer;font-family:var(--sans);font-size:14px}
  .strand-row:hover{background:var(--paper-deep)}
  .strand-row b{font-size:15px}
  .strand-row span{color:var(--ink-faint);font-size:12px;display:block}
  .filterbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;font-family:var(--sans)}
  .filterbar button{font-size:12.5px;border:1px solid var(--line);background:var(--card);
    border-radius:15px;padding:5px 14px;cursor:pointer;color:var(--ink-soft)}
  .filterbar button.active{background:var(--accent);color:#f6ecdd;border-color:var(--accent)}
  .detail-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;flex-wrap:wrap}
  .backlink{font-family:var(--sans);font-size:12.5px;color:var(--ink-faint);display:inline-block;margin-bottom:14px}
  .person-layout{display:grid;grid-template-columns:2fr 1fr;gap:24px;margin-top:18px}
  @media(max-width:800px){.person-layout{grid-template-columns:1fr}}
  .factbox{background:var(--paper-deep);border:1px solid var(--line);border-radius:6px;padding:16px 18px;
    font-family:var(--sans);font-size:13px}
  .factbox dt{color:var(--ink-faint);font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin-top:10px}
  .factbox dd{margin:1px 0 0}
  .portrait{width:100%;aspect-ratio:4/5;background:linear-gradient(150deg,#e6dcc6,#d5c6a8);
    border:1px solid var(--line);border-radius:4px;display:flex;align-items:center;justify-content:center;
    color:#8a7b5e;font-family:var(--sans);font-size:12px;margin-bottom:12px;text-align:center;padding:10px}
  .prose p{margin-bottom:12px}
  .prose .cite{font-family:var(--sans);font-size:11px;color:var(--gold);vertical-align:super;cursor:pointer}
  .mention-list li{margin-bottom:10px}
  .mention-list{list-style:none}
  .snippet{color:var(--ink-soft);font-style:italic;font-size:14.5px}
  .source-layout{display:grid;grid-template-columns:1fr 1.25fr;gap:24px;margin-top:20px}
  @media(max-width:860px){.source-layout{grid-template-columns:1fr}}
  .scanbox{background:#efe6d2;border:1px solid var(--line);border-radius:4px;padding:14px;
    box-shadow:var(--shadow)}
  .scanbox svg{width:100%;height:auto;display:block;border:1px solid #d8cbae;background:#f4ecd9}
  .scan-caption{font-family:var(--sans);font-size:11.5px;color:var(--ink-faint);margin-top:8px;text-align:center}
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;font-family:var(--sans);flex-wrap:wrap}
  .tabs button{font-size:12.5px;border:1px solid var(--line);border-bottom:none;background:var(--paper-deep);
    padding:6px 14px;cursor:pointer;border-radius:5px 5px 0 0;color:var(--ink-soft)}
  .tabs button.active{background:var(--card);font-weight:700;color:var(--accent)}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:18px 0 26px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px 10px;text-align:center;cursor:pointer;box-shadow:var(--shadow)}
  .stat b{display:block;font-size:26px;color:var(--accent);font-family:Georgia,serif}
  .stat span{font-family:var(--sans);font-size:12px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.08em}
  .srcbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 18px;font-family:var(--sans)}
  .srcbar input[type=text]{flex:1 1 180px;min-width:150px;font-size:13.5px;padding:7px 10px;border:1px solid var(--line);border-radius:5px;background:var(--card);color:var(--ink)}
  .srcbar select{font-size:13px;padding:7px 8px;border:1px solid var(--line);border-radius:5px;background:var(--card);color:var(--ink);max-width:170px}
  .srcbar .lbl{font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.07em;display:block;margin-bottom:2px}
  .pagenav{display:flex;gap:8px;align-items:center;margin:16px 0 0;font-family:var(--sans)}
  .pagenav button{font-size:14px;border:1px solid var(--line);background:var(--card);border-radius:5px;padding:6px 12px;cursor:pointer;color:var(--ink)}
  .pagenav button:disabled{opacity:.35;cursor:default}
  .pagenav select{font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:5px;background:var(--card);color:var(--ink);max-width:220px}
  .badge.newb{background:var(--accent);color:#f6ecdd}
  mark{background:#f0dfa3;color:inherit;padding:0 2px;border-radius:2px}
  .tl-dec{font-family:var(--sans);font-size:12px;letter-spacing:.14em;color:var(--ink-faint);text-transform:uppercase;margin:22px 0 6px;border-bottom:1px solid var(--line);padding-bottom:4px;list-style:none}
  .tl-life h4{font-weight:normal;font-size:14.5px;margin:0}
  .tl-life{padding:2px 0}
  .tl-cent{background:var(--card);border:1px solid var(--line);border-radius:6px;margin-bottom:12px;padding:4px 16px;box-shadow:var(--shadow)}
  .tl-cent summary{cursor:pointer;font-family:Georgia,serif;font-size:17px;padding:10px 0;color:var(--accent)}
  .tl-cent[open] summary{border-bottom:1px solid var(--line);margin-bottom:8px}
  .result-hit{margin-bottom:10px;cursor:pointer;transition:border-color .15s}
  .result-hit:hover{border-color:var(--accent)}
  @media(max-width:640px){nav.main button{font-size:12px;padding:7px 7px}.stats{grid-template-columns:repeat(3,1fr)}}
  .transcript{white-space:pre-wrap;font-size:15.5px;line-height:1.75}
  .transcript .unc{background:#f4e6c8;border-radius:2px;padding:0 2px;cursor:help}
  .transcript .mention{color:var(--accent);border-bottom:1px dotted var(--accent-soft);cursor:pointer}
  .note{font-family:var(--sans);font-size:12px;color:var(--ink-faint);background:var(--paper-deep);
    border-left:3px solid var(--gold);padding:8px 12px;border-radius:0 4px 4px 0;margin-top:14px}
  .timeline{list-style:none;border-left:2px solid var(--line);margin-left:8px;padding-left:26px}
  .timeline li{position:relative;margin-bottom:26px}
  .timeline li::before{content:'';position:absolute;left:-33px;top:6px;width:12px;height:12px;
    border-radius:50%;background:var(--accent);border:2px solid var(--paper)}
  .timeline .tl-date{font-family:var(--sans);font-size:12px;color:var(--gold);font-weight:700;
    text-transform:uppercase;letter-spacing:.08em}
  .timeline h4{font-weight:normal;font-size:17px}
  .timeline p{color:var(--ink-soft);font-size:14.5px}
  .tree-wrap{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px;
    box-shadow:var(--shadow);overflow-x:auto}
  .tree-wrap svg{min-width:700px;width:100%;height:auto}
  .tree-node rect{fill:var(--paper-deep);stroke:var(--line);rx:5}
  .tree-node.main rect{fill:#efe0de;stroke:var(--accent-soft)}
  .tree-node text{font-family:var(--sans);fill:var(--ink)}
  .tree-node{cursor:pointer}
  .tree-node:hover rect{stroke:var(--accent);stroke-width:2}
  .tree-line{stroke:var(--ink-faint);stroke-width:1.3;fill:none}
  .tree3{display:grid;gap:14px}
  .tree-mid{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:start}
  @media(max-width:860px){.tree-mid{grid-template-columns:1fr}}
  .tgroup{border:1px dashed var(--line);border-radius:8px;padding:10px 12px;background:rgba(255,255,255,.35)}
  .tlabel{font-family:var(--sans);font-size:11px;color:var(--ink-faint);text-transform:uppercase;
    letter-spacing:.1em;margin-bottom:8px;text-align:center}
  .crumbs{font-family:var(--sans);font-size:12.5px;color:var(--ink-faint)}
  .crumbs a{color:var(--accent-soft)}
  .elab{display:block;font-family:var(--sans);font-size:11px;color:var(--ink-faint);margin:10px 0 3px;
    text-transform:uppercase;letter-spacing:.06em}
  .ein{width:100%;font-family:var(--serif);font-size:14px;border:1px solid var(--line);border-radius:5px;
    padding:7px 9px;background:var(--paper);box-sizing:border-box}
  .result-block h3{font-size:15px;font-family:var(--sans);color:var(--ink-faint);
    text-transform:uppercase;letter-spacing:.1em;margin:22px 0 10px}
  mark{background:#f0dfae;padding:0 1px}
  .modal-back{position:fixed;inset:0;background:rgba(30,22,12,.45);display:flex;
    align-items:center;justify-content:center;z-index:100;padding:20px}
  .modal{background:var(--card);border-radius:8px;max-width:520px;padding:26px 28px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
  .modal h3{font-size:20px;font-weight:normal;margin-bottom:10px}
  .modal p{font-size:14.5px;color:var(--ink-soft);margin-bottom:10px}
  .modal textarea{width:100%;font-family:var(--serif);font-size:14px;border:1px solid var(--line);
    border-radius:5px;padding:10px;background:var(--paper);min-height:80px;margin:8px 0}
  .btn{font-family:var(--sans);font-size:13px;border:none;border-radius:16px;padding:8px 18px;
    cursor:pointer;background:var(--accent);color:#f6ecdd;font-weight:600}
  .btn.ghost{background:none;border:1px solid var(--line);color:var(--ink-soft)}
  .btn-row{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}
  .propose{font-family:var(--sans);font-size:12px;color:var(--ink-faint);border:1px dashed var(--line);
    background:none;border-radius:14px;padding:4px 12px;cursor:pointer}
  .propose:hover{color:var(--accent);border-color:var(--accent-soft)}
  .empty{color:var(--ink-faint);font-style:italic}
  footer{border-top:3px double var(--line);text-align:center;padding:26px;font-family:var(--sans);
    font-size:12px;color:var(--ink-faint)}
  /* ---------- Redesign 2026: Navigation ---------- */
  .navdrop{position:relative;display:inline-block}
  .navdrop .dmenu{display:none;position:absolute;top:100%;left:0;background:var(--card);
    border:1px solid var(--line);border-radius:0 0 8px 8px;box-shadow:0 10px 26px rgba(46,36,24,.16);
    min-width:190px;z-index:70;padding:6px 0}
  .navdrop:hover .dmenu,.navdrop:focus-within .dmenu{display:block}
  .dmenu button{display:block;width:100%;text-align:left;border:none;background:none;cursor:pointer;
    font-family:var(--sans);font-size:13.5px;color:var(--ink-soft);padding:9px 16px;border-bottom:none!important}
  .dmenu button:hover{background:var(--paper-deep);color:var(--accent)}
  /* ---------- Redesign 2026: Startseite ---------- */
  .vorspann{font-family:var(--sans);font-size:11.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold)}
  .hx-hero{display:grid;grid-template-columns:5fr 6fr;gap:44px;align-items:center;padding:26px 0 10px}
  .hx-hero h1{font-family:var(--serif);font-weight:normal;font-size:clamp(28px,4vw,42px);line-height:1.16;margin:12px 0 16px}
  .hx-hero p.intro{font-family:var(--serif);font-size:17px;color:var(--ink-soft);max-width:46ch}
  .hx-cta{display:flex;gap:14px;margin-top:24px;flex-wrap:wrap}
  .btn.big{font-size:14.5px;padding:11px 22px;border-radius:8px}
  .btn.sec{background:none;border:1.5px solid var(--accent);color:var(--accent)}
  figure.heldenbild{margin:0}
  figure.heldenbild .rahmen{background:#fff;padding:12px 12px 10px;border:1px solid var(--line);
    box-shadow:0 10px 30px rgba(43,36,28,.10);transform:rotate(.4deg);cursor:pointer}
  figure.heldenbild img{display:block;width:100%;height:auto;max-height:430px;object-fit:contain;background:#f4ecd9}
  figure.heldenbild figcaption{font-family:var(--sans);font-size:12.5px;color:var(--ink-faint);margin-top:10px;text-align:right}
  .suchband{margin:26px 0 44px}
  .suchband .feld{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:4px 8px 4px 22px;box-shadow:0 4px 18px rgba(43,36,28,.06)}
  .suchband input{flex:1;border:none;background:none;outline:none;font-family:var(--sans);
    font-size:16px;color:var(--ink);padding:13px 0}
  .suchband .hinweis{font-family:var(--sans);font-size:12.5px;color:var(--ink-faint);margin-top:8px;padding-left:6px}
  .sek-kopf{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--line);
    padding-bottom:9px;margin:44px 0 22px}
  .sek-kopf h2{font-family:var(--serif);font-weight:normal;font-size:24px}
  .sek-kopf a{font-family:var(--sans);font-size:13px}
  .storyx{display:grid;grid-template-columns:7fr 4fr;background:var(--card);border:1px solid var(--line);
    border-radius:12px;overflow:hidden;box-shadow:0 6px 24px rgba(43,36,28,.07)}
  .storyx .text{padding:30px 34px}
  .kicker{font-family:var(--sans);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
  .storyx h3{font-family:var(--serif);font-weight:normal;font-size:28px;line-height:1.2;margin:10px 0 12px}
  .storyx p.tz{font-family:var(--serif);font-size:15.5px;color:var(--ink-soft);max-width:58ch}
  .storyx .smeta{display:flex;gap:18px;flex-wrap:wrap;font-family:var(--sans);font-size:12.5px;color:var(--ink-faint);margin:18px 0 16px}
  .storyx .smeta b{color:var(--ink)}
  .storyx .bild{position:relative;min-height:260px;background:var(--paper-deep)}
  .storyx .bild img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 18%}
  .storyx .bild figcaption{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(20,15,10,.72));
    color:#f3ecdf;font-family:var(--sans);font-size:11.5px;padding:24px 14px 10px;text-align:right}
  .fam-gitter{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
  .famkarte{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--fc,var(--accent));
    border-radius:10px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:transform .15s}
  .famkarte:hover{transform:translateY(-2px)}
  .famkarte .fk-bild{height:112px;background:var(--paper-deep);position:relative;overflow:hidden}
  .famkarte .fk-bild img{width:100%;height:100%;object-fit:cover;object-position:50% 18%;filter:sepia(.12)}
  .famkarte .fk-mono{display:flex;align-items:center;justify-content:center;height:100%;
    font-family:var(--serif);font-size:42px;color:var(--fc);opacity:.5}
  .famkarte .fk-text{padding:14px 17px 16px}
  .famkarte h3{font-family:var(--serif);font-weight:normal;font-size:19px;margin:0}
  .famkarte .zeit{font-family:var(--sans);font-size:11.5px;color:var(--ink-faint);letter-spacing:.04em;margin:2px 0 7px}
  .famkarte p{font-family:var(--sans);font-size:13px;color:var(--ink-soft);line-height:1.5}
  .famkarte .fk-fakten{margin-top:9px;font-family:var(--sans);font-size:12px;color:var(--ink-faint)}
  .famkarte .fk-fakten b{color:var(--fc)}
  .hx-zwei{display:grid;grid-template-columns:5fr 4fr;gap:20px;margin-top:44px}
  .fund{background:var(--accent);color:#f6ecdd;border-radius:12px;padding:30px 32px}
  .fund .kicker{color:#d9b8a0}
  .fund blockquote{font-family:var(--serif);font-size:18.5px;line-height:1.5;margin:13px 0 14px;font-style:italic}
  .fund .quelle{font-family:var(--sans);font-size:12.5px;color:#e8d3bd}

  .neuliste li{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);

  .neuliste li:hover{color:var(--accent)}
  .neuliste li:last-child{border-bottom:none}

  .neuliste .datum{margin-left:auto;font-size:11.5px;color:var(--ink-faint);white-space:nowrap}

  .wege{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .weg{display:block;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 13px;
    font-family:var(--sans);font-size:13px;cursor:pointer;color:var(--ink)}

  .weg b{color:var(--accent);display:block}
  .kennzahlen{display:flex;flex-wrap:wrap;gap:6px 20px;font-family:var(--sans);font-size:12.5px;

  .kennzahlen b{font-family:var(--serif);font-size:20px;color:var(--ink);margin-right:5px}

  .stkarte:hover{transform:translateY(-2px)}
  .stkarte .cover{height:150px;background:var(--paper-deep);overflow:hidden}
  .stkarte .cover img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;filter:sepia(.1)}
  .stkarte .stx{padding:16px 18px 18px}
  .stkarte h3{font-family:var(--serif);font-weight:normal;font-size:20px;margin-bottom:6px}
  .stkarte p{font-family:var(--serif);font-size:14px;color:var(--ink-soft)}

  .kap-bar i{display:block;height:100%;background:var(--gold)}
  .kapitel{font-family:var(--serif);font-size:17px;line-height:1.75;max-width:70ch}
  .kapitel p{margin-bottom:16px}
  .kap-titel{font-family:var(--serif);font-weight:normal;font-size:27px;margin:6px 0 18px}
  @media(max-width:900px){
    .hx-hero{grid-template-columns:1fr;gap:22px}
    .fam-gitter{grid-template-columns:1fr 1fr}
    .hx-zwei,.hx-fuss,.storyx{grid-template-columns:1fr}
    .storyx .bild{min-height:200px}
  }
  @media(max-width:560px){.fam-gitter{grid-template-columns:1fr}}

  .mono{display:flex;align-items:center;justify-content:center;width:100%;height:100%;

  .prow .mono{font-size:14px}
  .prow .pdat{color:var(--ink-faint);font-size:12.5px;margin-left:auto;white-space:nowrap}
  .viewtoggle{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;font-family:var(--sans);font-size:12.5px}
  .viewtoggle button{border:none;background:var(--card);padding:6px 13px;cursor:pointer;color:var(--ink-soft)}
  .viewtoggle button.active{background:var(--accent);color:#f6ecdd}
  .lnav{position:sticky;top:0;z-index:40;display:flex;gap:2px;flex-wrap:wrap;background:var(--paper);
    border-bottom:1px solid var(--line);padding:6px 0;margin:14px 0 22px;font-family:var(--sans)}
  .lnav a{font-size:13px;color:var(--ink-soft);padding:6px 12px;border-radius:6px;text-decoration:none}
  .lnav a:hover{background:var(--paper-deep);color:var(--accent);text-decoration:none}
  .phead{display:grid;grid-template-columns:150px 1fr auto;gap:24px;align-items:start}
  .phead .pportrait{width:150px;border-radius:8px;border:1px solid var(--line);overflow:hidden;cursor:pointer;aspect-ratio:4/5}
  .phead .pportrait img{width:100%;height:100%;object-fit:cover;object-position:50% 15%}
  .phead h2{font-family:var(--serif);font-weight:normal;font-size:34px;line-height:1.1;margin-bottom:4px}
  .phead .pdates{font-family:var(--sans);font-size:14px;color:var(--ink-soft);margin-bottom:8px}
  .phead .pfam{font-family:var(--sans);font-size:13px;color:var(--ink-soft);line-height:1.7}
  .phead .pfam .lbl{color:var(--ink-faint);font-size:11px;text-transform:uppercase;letter-spacing:.07em;margin-right:5px}
  .privnote{font-family:var(--sans);font-size:12.5px;color:var(--ink-faint);font-style:italic}
  .mentcard{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold);
    border-radius:0 8px 8px 0;padding:12px 16px;margin-bottom:10px}
  .mentcard .mhead{font-family:var(--sans);font-size:12px;color:var(--ink-faint);margin-bottom:5px;display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
  .mentcard .mlink{margin-left:auto;font-size:12.5px;white-space:nowrap}
  @media(max-width:760px){.phead{grid-template-columns:96px 1fr}.phead .pportrait{width:96px}.phead>div:last-child{grid-column:1/-1}}

<script>
/* ---------- APP LOGIC ---------- */
const t=o=>o?(o[LANG]!==undefined?o[LANG]:(o.de!==undefined?o.de:o)):'';
const P=id=>PERSONS.find(p=>p.id===id);
const S=id=>SOURCES.find(s=>s.id===id);
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const stripHtml=s=>s.replace(/<[^>]*>/g,' ');

function setLang(l){LANG=l;render();}
const HWIN=(()=>{try{void window.top.history;return window.top;}catch(e){return window;}})();
let FROMPOP=false;
function go(name,id,extra){
  VIEW={name,id,extra};render();window.scrollTo(0,0);
  if(!FROMPOP){try{HWIN.history.pushState({wfa:VIEW},'');}catch(e){}}
}
try{
  HWIN.history.replaceState({wfa:{name:'home'}},'');
  HWIN.addEventListener('popstate',e=>{
    if(e.state&&e.state.wfa){FROMPOP=true;const v=e.state.wfa;VIEW=v;render();window.scrollTo(0,0);FROMPOP=false;}
  });
}catch(e){}

function renderTranscript(dipl){
  return esc(dipl)
    .replace(/&lt;m data-p="([\w\-]+)"&gt;([\s\S]*?)&lt;\/m&gt;/g,
      (_,p,txt)=>`<span class="mention" onclick="go('person','${p}')">${txt}</span>`)
    .replace(/&lt;u title="([^"]*)"&gt;([\s\S]*?)&lt;\/u&gt;/g,
      (_,ti,txt)=>`<span class="unc" title="${ti}">${txt}</span>`);
}
function mentionsOf(pid){
  const out=[];
  SOURCES.forEach(s=>s.pages.forEach((pg,pi)=>{
    if(pg.dipl.includes(`data-p="${pid}"`)){
      out.push({src:s,page:pg.n,pi,label:pg.label,snippet:t(pg.read).slice(0,140)+'…'});
    }
  }));
  return out;
}
let MCOUNT=null;
function mentionCount(pid){
  if(!MCOUNT){
    MCOUNT={};
    SOURCES.forEach(s=>s.pages.forEach(pg=>{
      const seen=new Set();let m;const re=/data-p="([^"]+)"/g;
      while((m=re.exec(pg.dipl)))seen.add(m[1]);
      seen.forEach(id=>{MCOUNT[id]=(MCOUNT[id]||0)+1;});
    }));
    SOURCES.forEach(s=>{[s.author,s.addressee].forEach(id=>{if(id)MCOUNT[id]=(MCOUNT[id]||0)+1;});});
  }
  return MCOUNT[pid]||0;
}
function monoHtml(p){
  const init=(p.name||'?').split(/\s+/).filter(w=>/^[A-ZÄÖÜŁŚŻ]/.test(w)).slice(0,2).map(w=>w[0]).join('')||'?';
  const c=FAMCOLOR[(p.strand&&p.strand[0])]||'var(--accent)';
  return `<div class="mono" style="--mc:${c}">${init}</div>`;
}
function pThumb(p,cls){
  return `<div class="pbild">${(p.img&&IMGS[p.img])?`<img src="${IMGS[p.img]}" alt="">`:monoHtml(p)}</div>`;
}
function pBadges(p){
  let out='';
  if(ADMIN)out+=` <span class="badge ${p.status==='ident'?'ok':'open'}">${t(p.status==='ident'?UI.stIdent:UI.stOpen)}</span>`;
  if(p.living)out+=` <span class="badge rough" title="${t(UI.privLong)}">${t(ADMIN?UI.stLiving:UI.privShort)}</span>`;
  return out;
}
function chipTags(tags){return tags.map(tg=>`<span class="chip" onclick="go('tag','${tg}')">${t(TAGS[tg])}</span>`).join('');}
function chipStrands(arr){return arr.map(st=>`<span class="chip strand" onclick="go('persons',null,'${st}')">${t(STRANDS[st])}</span>`).join('');}
function statusBadge(st){const m={done:'ok',review:'rough',rough:'rough'};return `<span class="badge ${m[st]||'rough'}">${t(UI.statusMap[st])}</span>`;}

/* ---------- views ---------- */
const FAMFOTO={wessling:'ph06',ganz:'ph22',ballin:null,adams:'ph25',peters:null,mayer:null};
const FAMCOLOR={wessling:'var(--f-wessling)',ganz:'var(--f-ganz)',ballin:'var(--f-ballin)',adams:'var(--f-adams)',peters:'var(--f-peters)',mayer:'var(--f-mayer)'};
const FUND=[
 {q:{de:'»Als ich Brötchen holen will, treffe ich Dan beim Schneeschippen. Er ist gar nicht böse, holt sogar die Brötchen, und wir frühstücken zusammen bei Kerzenlicht wie in alten Zeiten — dem Himmel sei Dank!«',
     en:'»When I go to fetch bread rolls I find Dan shovelling snow. He is not cross at all — he even fetches the rolls, and we have breakfast together by candlelight like in the old days — thank heavens!«',
     pl:'»Gdy idę po bułki, spotykam Dana przy odśnieżaniu. Wcale się nie gniewa, sam przynosi bułki i jemy śniadanie razem przy świecach jak za dawnych czasów — dzięki niebiosom!«'},
  who:{de:'Anneliese Wessling, Tagebuch, 3. Januar 1985',en:'Anneliese Wessling, diary, 3 January 1985',pl:'Anneliese Wessling, dziennik, 3 stycznia 1985'},
  s:'q-tb85',pi:3},

const KIN_ANCHORS=['anneliese-wessling','thomas','brigitte','irene','i282651973914','i282652294733'];
function ancSet(id){
  const out=new Map([[id,0]]);const st=[[id,0]];
  while(st.length){const [c,d]=st.pop();const r=window.RELX&&RELX[c];if(!r)continue;
    (r.par||[]).forEach(p=>{if(!out.has(p)||out.get(p)>d+1){out.set(p,d+1);st.push([p,d+1]);}});}
  return out;
}
function bloodRel(xid,aid){
  if(xid===aid)return null;
  const ax=ancSet(xid),aa=ancSet(aid);
  let best=null;
  ax.forEach((v,c)=>{if(aa.has(c)){const u=aa.get(c);if(!best||u+v<best.u+best.v)best={u,v};}});
  return best;
}
function kinTerm(u,v){
  const urde=n=>n<=0?'':'Ur-'+Array(n-1).fill('ur-').join('');
  const L=LANG;
  const T=(de,en,pl)=>({de,en,pl}[L]||de);
  if(v===0){ // Vorfahr
    if(u===1)return T('Elternteil','parent','rodzic');
    if(u===2)return T('Großvater/-mutter','grandparent','dziadek/babcia');
    return T(urde(u-2)+'großvater/-mutter','great-'.repeat(u-2)+'grandparent','pra'.repeat(u-2)+'dziadek/-babcia');
  }
  if(u===0){ // Nachfahr
    if(v===1)return T('Kind','child','dziecko');
    if(v===2)return T('Enkel:in','grandchild','wnuk/wnuczka');
    return T(urde(v-2)+'enkel:in','great-'.repeat(v-2)+'grandchild','pra'.repeat(v-2)+'wnuk/-wnuczka');
  }
  if(u===1&&v===1)return T('Geschwister','sibling','rodzeństwo');
  if(v===1){ // Geschwister eines Vorfahren
    if(u===2)return T('Onkel/Tante','uncle/aunt','wuj/ciotka');
    if(u===3)return T('Großonkel/-tante','great-uncle/-aunt','wujeczny dziadek/babcia');
    return T(urde(u-3)+'großonkel/-tante','great-'.repeat(u-2)+'uncle/-aunt','pra'.repeat(u-3)+'wujeczny dziadek/babcia');
  }
  if(u===1){ // Kind von Geschwistern
    if(v===2)return T('Neffe/Nichte','nephew/niece','bratanek/siostrzenica');
    if(v===3)return T('Großneffe/-nichte','great-nephew/-niece','wnuk brata/siostry');
    return T(urde(v-3)+'großneffe/-nichte','great-'.repeat(v-2)+'nephew/-niece','pra-bratanek/-siostrzenica');
  }
  const grad=Math.min(u,v)-1, ent=Math.abs(u-v);
  return T('Cousin:e '+grad+'. Grades'+(ent?', '+ent+'× entfernt':''),
           (grad===1?'first':grad===2?'second':grad+'th')+' cousin'+(ent?' '+ent+'× removed':''),
           'kuzyn(ka) '+grad+'. stopnia'+(ent?', oddal. '+ent:''));
}
function kinToAnchor(xid){
  if(!window.RELX||!RELX[xid])return null;
  for(const aid of KIN_ANCHORS){
    if(aid===xid||!P(aid)||!RELX[aid])continue;
    const b=bloodRel(xid,aid);
    if(b&&b.u+b.v>0&&b.u<=12&&b.v<=12)return {aid,term:kinTerm(b.u,b.v),married:false};
  }
  // angeheiratet: über Ehepartner
  const spo=(RELX[xid]&&RELX[xid].spo)||[];
  for(const s of spo){
    for(const aid of KIN_ANCHORS){

const GMON={jan:1,feb:2,mar:3,'mär':3,'maer':3,mrz:3,apr:4,may:5,mai:6- 1,jun:6,jul:7,aug:8,sep:9,sept:9,oct:10,okt:10,nov:11,dec:12,dez:12,'déc':12,'dec.':12};
function parseGedDate(s){
  if(!s||s==='?')return null;
  s=String(s).trim().replace(/^abt\.?\s*/i,'').replace(/^ca\.?\s*/i,'').replace(/^about\s*/i,'');
  let m=s.match(/^(\d{1,2})\.?\s+([A-Za-zÀ-ž.]+)\s+(\d{4})$/);
  if(m){const mo=GMON[m[2].toLowerCase().slice(0,4)]||GMON[m[2].toLowerCase().slice(0,3)];
    if(mo)return {iso:m[3]+'-'+String(mo).padStart(2,'0')+'-'+m[1].padStart(2,'0'),disp:parseInt(m[1],10)+'.'+mo+'.'+m[3]};}
  m=s.match(/^([A-Za-zÀ-ž.]+)\s+(\d{4})$/);
  if(m){const mo=GMON[m[1].toLowerCase().slice(0,4)]||GMON[m[1].toLowerCase().slice(0,3)];
    if(mo)return {iso:m[2]+'-'+String(mo).padStart(2,'0'),disp:mo+'/'+m[2]};}
  m=s.match(/(\d{4})/);
  if(m)return {iso:m[1],disp:m[1]};
  return null;
}
function lifeEvents(){
  const out=[];
  PERSONS.forEach(p=>{
    const b=parseGedDate(p.born), dd=parseGedDate(p.died);
    if(b)out.push({iso:b.iso,disp:b.disp,kind:'life',sym:'✳',pid:p.id,name:p.name});
    if(dd)out.push({iso:dd.iso,disp:dd.disp,kind:'life',sym:'✝',pid:p.id,name:p.name});
  });
  return out;
}

function vTimeline(){

function vSearch(q){

  // 2) Fundstellen auf Seitenebene: Text ODER Personen-Markierung einer Trefferperson

  }));
  hits.sort((a,b)=>((b.s.added||'').localeCompare(a.s.added||''))||a.pi-b.pi);
  // 3) Quellen (nur Titel/Zusammenfassung) ohne Seitentreffer
  const sMeta=SOURCES.filter(s=>matchAll(norm(t(s.title)+' '+t(s.summary)+' '+s.sig),ts)&&!hits.some(h=>h.s.id===s.id));
  // 4) Ereignisse
  const eHits=EVENTS.filter(e=>matchAll(norm(t(e.title)+' '+t(e.text)),ts));

    ${hits.length>HMAX?`<p class="empty">… ${hits.length-HMAX} weitere</p>`:''}</div>`:''}
  ${pHits.length?`<div class="result-block"><h3>${t(UI.inPersons)}</h3><div class="grid cols3">${pHits.slice(0,9).map(cardPerson).join('')}</div></div>`:''}

}
function doSearch(){const q=document.getElementById('searchInput').value.trim();if(q){HLQ='';go('search',q);}}
let HLQ='';
const DIA={'ä':'a','ö':'o','ü':'u','ß':'ss','ą':'a','ć':'c','ę':'e','ł':'l','ń':'n','ó':'o','ś':'s','ź':'z','ż':'z','é':'e','è':'e','à':'a','ç':'c'};
function norm(s){return (s||'').toLowerCase().replace(/[äöüßąćęłńóśźżéèàç]/g,c=>DIA[c]||c).replace(/(?<!q)ue/g,'u').replace(/ae/g,'a').replace(/oe/g,'o');}
function terms(q){return norm(q).split(/\s+/).filter(x=>x.length>1);}
function wordMatch(w,x){if(w===x)return true;if(w.startsWith(x)&&w.length-x.length<=3)return true;if(x.length>=6&&w.includes(x))return true;return false;}
function matchAll(hayN,ts){const ws=hayN.split(/[^a-z0-9]+/);return ts.every(x=>ws.some(w=>wordMatch(w,x)));}
function goHit(sid,pi,q){HLQ=q;go('source',sid,'dipl:'+pi);}
function markify(html,q){
  if(!q)return html;
  const ts=terms(q);if(!ts.length)return html;
  return html.split(/(<[^>]+>)/g).map(seg=>{
    if(seg.startsWith('<')||!seg)return seg;
    // Wortgrenzen im Original finden, Wörter normalisiert prüfen
    return seg.replace(/[A-Za-zÄÖÜäöüßĄĆĘŁŃÓŚŹŻąćęłńóśźż0-9\-]+/g,w=>{
      const parts=w.split('-');
      const hit=parts.some(p=>{const pn=norm(p);return ts.some(x=>wordMatch(pn,x));});
      return hit?'<mark>'+w+'</mark>':w;
    });
  }).join('');
}
function snippetOf(text,q,len){
  const ts=terms(q);const tn=norm(text);
  let idx=-1;for(const x of ts){const i=tn.indexOf(x);if(i>=0&&(idx<0||i<idx))idx=i;}
  if(idx<0)idx=0;
  const a=Math.max(0,idx-70),b=Math.min(text.length,idx+(len||110));
  return (a>0?'… ':'')+text.slice(a,b)+(b<text.length?' …':'');
}

let QALOG=[];
const STOPTOK=['wessling','adams','peters','ballin','ganz','mayer','wann','wurde','geboren','gestorben','was','wer','wie','welche','briefe','brief'];
function qaMatchPersons(ql){
  const res=[];
  for(const p of PERSONS){
    const toks=(p.name+' '+(p.nameForms||'')).toLowerCase()
      .replace(/[„“”"()\[\],.;:!?]/g,' ').split(/\s+/)
      .filter(w=>w.length>=4&&!STOPTOK.includes(w));
    let best=0;
    for(const tk of toks){ if(ql.includes(tk)) best=Math.max(best,tk.length); }
    if(best) res.push([best,p]);
  }
  res.sort((a,b)=>b[0]-a[0]);
  const seen=new Set(), out=[];
  for(const [s,p] of res){ if(!seen.has(p.id)){seen.add(p.id);out.push(p);} if(out.length>=3)break; }
  return out;
}
function qaPersonBlock(p){
  const dates=(p.born&&p.born!=='?'?t(UI.born)+' '+p.born+(p.bornp?' — '+p.bornp:''):'')+
    (p.died?'<br>'+t(UI.died)+' '+p.died+(p.diedp?' — '+p.diedp:''):'');
  const r=window.RELX&&RELX[p.id];
  const rel=r?[[UI.fam.parents,r.par],[UI.fam.spouses,r.spo],[UI.fam.children,r.chi]]
    .filter(x=>x[1].length)
    .map(x=>`${t(x[0])}: ${x[1].slice(0,6).map(i=>P(i)?`<a onclick="go('person','${i}')">${P(i).name}</a>`:'').filter(Boolean).join(', ')}`)
    .join('<br>'):'';
  const men=mentionsOf(p.id);
  return `<div style="display:flex;gap:12px;align-items:flex-start">
   ${(p.img&&IMGS[p.img])?`<img src="${IMGS[p.img]}" style="width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--line)">`:''}
   <div><b><a onclick="go('person','${p.id}')">${p.name}</a></b>${p.living?` <span class="badge rough">${t(UI.stLiving)}</span>`:''}
   <div class="meta" style="margin:3px 0">${dates||p.nameForms||'—'}</div>
   ${rel?`<div style="font-size:13px;font-family:var(--sans)">${rel}</div>`:''}
   ${men.length?`<div class="meta" style="margin-top:5px">${t(UI.qaMentions)}: ${men.slice(0,4).map(m=>`<a onclick="go('source','${m.src.id}')">${m.src.sig}</a>`).join(' · ')}</div>`:''}
   <div style="margin-top:5px;font-family:var(--sans);font-size:12.5px"><a onclick="go('person','${p.id}')">${t(UI.openArticle)} →</a> &nbsp; <a onclick="go('tree','${p.id}')">${t(UI.nav.tree)} →</a></div>
   </div></div>`;
}
function qaAnswer(q){
  const ql=' '+q.toLowerCase()+' ';
  const parts=[];
  const pers=qaMatchPersons(ql);
  pers.forEach(p=>parts.push(qaPersonBlock(p)));
  const years=[...new Set((q.match(/\b(1[5-9]\d\d|20\d\d)\b/g)||[]))];
  for(const y of years){
    const evs=EVENTS.filter(ev=>String(ev.date).startsWith(y)||t(ev.title).includes(y)||t(ev.text).includes(y));
    const srcs=SOURCES.filter(s=>String(s.date).includes(y));
    if(evs.length) parts.push(`<div class="meta" style="margin-bottom:4px">${t(UI.qaEvents)} ${y}:</div>`+
      evs.map(ev=>`<div style="margin-bottom:6px"><b>${t(ev.title)}</b><br><span style="font-size:13.5px">${t(ev.text)}</span> <span class="meta">${ev.sources.map(sid=>S(sid)?`<a onclick="go('source','${sid}')">${S(sid).sig}</a>`:'').join(' ')}</span></div>`).join(''));
    if(srcs.length) parts.push(`<div class="meta" style="margin:4px 0">${t(UI.qaSources)} (${y}):</div>`+
      srcs.map(s=>`<div>• <a onclick="go('source','${s.id}')">${t(s.title)}</a></div>`).join(''));
  }
  const tagHits=Object.keys(TAGS).filter(tg=>['de','en','pl'].some(l=>{
    const lab=(TAGS[tg][l]||'').toLowerCase(); return lab.length>=4&&ql.includes(lab.split(' ')[0]);
  }));
  for(const tg of tagHits.slice(0,2)){
    const srcs=SOURCES.filter(s=>s.tags&&s.tags.includes(tg));
    if(srcs.length) parts.push(`<div class="meta" style="margin:4px 0">${t(UI.taggedWith)} „${t(TAGS[tg])}":</div>`+
      srcs.map(s=>`<div>• <a onclick="go('source','${s.id}')">${t(s.title)}</a></div>`).join(''));
  }
  if(!parts.length){
    const hits=[];
    SOURCES.forEach(s=>{let hay=t(s.title)+' '+t(s.summary);
      s.pages.forEach(pg=>{hay+=' '+pg.read.de+' '+(pg.read[LANG]||'');});
      if(hay.toLowerCase().includes(q.toLowerCase())) hits.push({s,hay});});
    if(hits.length) parts.push(`<div class="meta" style="margin-bottom:4px">${t(UI.qaFallback)}</div>`+
      hits.slice(0,4).map(h=>`<div style="margin-bottom:6px"><a onclick="go('source','${h.s.id}')">${t(h.s.title)}</a><br><span style="font-size:13px">${hl(h.hay,q)}</span></div>`).join(''));
  }
  if(!parts.length) parts.push(`<span style="font-size:14px">${t(UI.qaNothing)}</span>`);
  return parts.join('<hr class="rule" style="margin:10px 0">');
}
function qaBubble(m,i){
  if(m.who==='u') return `<div style="text-align:right;margin:12px 0"><span style="display:inline-block;background:var(--accent);color:#f6ecdd;border-radius:14px 14px 2px 14px;padding:8px 14px;font-family:var(--sans);font-size:14px;max-width:80%;text-align:left">${m.html}</span></div>`;
  const ai=(window.AICFG&&AICFG.endpoint)?`<div style="margin-top:8px"><button class="propose" onclick="qaAI(${i})">🤖 ${t(UI.qaAI)}</button><div id="aislot${i}"></div></div>`:'';
  return `<div style="margin:12px 0"><div class="card" style="border-left:4px solid var(--gold)">${m.html}${ai}</div></div>`;
}
function qaAsk(q){
  const inp=document.getElementById('qaIn');
  q=q||(inp?inp.value.trim():''); if(!q)return;
  QALOG.push({who:'u',html:esc(q),q});
  QALOG.push({who:'a',html:qaAnswer(q),q});
  if(QALOG.length>40)QALOG=QALOG.slice(-40);
  render();
  window.scrollTo(0,document.body.scrollHeight);
  const inp2=document.getElementById('qaIn'); if(inp2){inp2.value='';inp2.focus();}
}
function qaContext(q){
  let ctx='';
  const add=s=>{if(ctx.length<7000)ctx+=s+'\n';};
  qaMatchPersons(' '+q.toLowerCase()+' ').forEach(p=>{
    add(p.name+' | '+(p.born||'')+' '+(p.bornp||'')+' | '+(p.died||'')+' '+(p.diedp||''));
    if(p.bio)add(stripHtml(t(p.bio)).slice(0,900));
  });
  SOURCES.forEach(s=>{let hay=(t(s.title)+' '+t(s.summary)).toLowerCase();
    const qtoks=q.toLowerCase().split(/\s+/).filter(w=>w.length>=4);
    if(qtoks.some(w=>hay.includes(w))){add(t(s.title)+': '+t(s.summary));}
    s.pages.forEach(pg=>{ if(qtoks.some(w=>pg.read.de.toLowerCase().includes(w))) add(pg.read.de.slice(0,900)); });
  });
  return ctx.slice(0,8000);
}
async function qaAI(i){
  const m=QALOG[i]; if(!m)return;
  const el=document.getElementById('aislot'+i); if(!el)return;
  el.innerHTML=`<div class="meta" style="margin-top:6px">${t(UI.qaAIWait)}</div>`;
  try{
    const r=await fetch(AICFG.endpoint,{method:'POST',
      headers:{'Content-Type':'application/json','X-Archive-Token':AICFG.token||''},
      body:JSON.stringify({question:m.q,lang:LANG,context:qaContext(m.q)})});
    if(!r.ok)throw new Error(r.status);
    const j=await r.json();
    el.innerHTML=`<div style="margin-top:8px;background:var(--paper-deep);border-radius:6px;padding:10px 12px;font-size:14px">🤖 ${esc(j.answer||'')}</div>`;
  }catch(err){ el.innerHTML=`<div class="meta" style="margin-top:6px">${t(UI.qaAIErr)}</div>`; }
}
function vAsk(){
  const ex={de:['Wer war Irene?','Wann wurde Fredi Durra geboren?','Was geschah 1943?','Poesiealbum'],

  return `<h2 class="page">${t(UI.qaTitle)}</h2><div class="page-sub">${t(UI.qaSub)}</div>

/* ---------- Sammelmappe (PDF-Export) ---------- */
let MAPPE=[];
function mappeAdd(kind,a,b){
  const key=kind+':'+a+':'+(b??'');
  if(!MAPPE.some(x=>x.key===key)) MAPPE.push({key,kind,a,b});
  render();
}
function mappeRemove(i){MAPPE.splice(i,1);render();}
function mappeMove(i,d){const j=i+d;if(j<0||j>=MAPPE.length)return;[MAPPE[i],MAPPE[j]]=[MAPPE[j],MAPPE[i]];render();}
function mappeTitle(it){
  if(it.kind==='person'){const p=P(it.a);return p?p.name:it.a;}
  const s=S(it.a);if(!s)return it.a;const pg=s.pages[it.b];
  return `${t(s.title)} — ${pg?(pg.label||t(UI.page)+' '+pg.n):''}`;
}
function vMappe(){
  if(!MAPPE.length) return `<h2 class="page">${t(UI.nav.mappe)}</h2><div class="page-sub">${t(UI.mappeSub)}</div><p class="empty">${t(UI.mappeEmpty)}</p>`;
  return `<h2 class="page">${t(UI.nav.mappe)}</h2><div class="page-sub">${t(UI.mappeSub)}</div>
  ${MAPPE.map((it,i)=>`<div class="card" style="margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
    <div style="font-size:15px"><b>${i+1}.</b> ${mappeTitle(it)}</div>
    <div style="display:flex;gap:6px;font-family:var(--sans)">
      <button class="propose" onclick="mappeMove(${i},-1)">↑</button>
      <button class="propose" onclick="mappeMove(${i},1)">↓</button>
      <button class="propose" onclick="mappeRemove(${i})">✕ ${t(UI.mappeRemove)}</button>
    </div></div>`).join('')}
  <div style="margin-top:18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap">
    <button class="btn" onclick="mappePrint()">⬇ ${t(UI.mappePdf)}</button>
    <span class="meta" style="margin:0">${t(UI.mappeHint)}</span></div>`;
}
function stripClicks(html){return (html||'').replace(/ onclick="[^"]*"/g,'');}
function mappePrint(){
  const items=MAPPE.map(it=>{
    if(it.kind==='person'){
      const p=P(it.a);if(!p)return '';
      const dates=(p.born&&p.born!=='?'?'*'+p.born:'')+(p.died?' · †'+p.died:'');
      return `<section><h2>${p.name}</h2><div class="m">${dates||''} ${p.bornp?'· *'+p.bornp:''}</div>${stripClicks(t(p.bio))||'<p><i>'+t(UI.gedAutoBio)+'</i></p>'}</section>`;
    }
    const s=S(it.a);if(!s)return '';const pg=s.pages[it.b];if(!pg)return '';
    const diplClean=esc(pg.dipl.replace(/<\/?(m|u)[^>]*>/g,''));
    const tr=(LANG!=='de'&&pg.read[LANG])?`<h4>${LANG==='en'?t(UI.tabEN):t(UI.tabPL)}</h4><p>${pg.read[LANG]}</p>`:'';
    return `<section><h2>${t(s.title)}</h2><div class="m">${s.sig} · ${pg.label||t(UI.page)+' '+pg.n} · ${s.date}</div>
      ${(typeof IMGS!=='undefined'&&pg.img&&IMGS[pg.img])?`<img src="${IMGS[pg.img]}">`:''}
      <h4>${t(UI.tabDipl)}</h4><pre>${diplClean}</pre>
      <h4>${t(UI.tabRead)}</h4><p>${pg.read.de}</p>${tr}</section>`;
  }).join('');
  const w=window.open('','_blank');
  if(!w){alert('Popup blockiert — bitte Popups für diese Datei erlauben.');return;}
  w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>${t(UI.brandTitle)}</title><style>
   body{font-family:Georgia,serif;color:#222;max-width:720px;margin:24px auto;line-height:1.55;padding:0 16px}
   h1{font-size:19px;letter-spacing:.12em;border-bottom:2px solid #999;padding-bottom:8px}
   h2{font-size:19px;margin:0 0 2px}
   h4{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:#8a6d1f;margin:14px 0 4px}
   .m{font-size:12px;color:#777;font-family:sans-serif;margin-bottom:8px}
   section{page-break-inside:avoid;border-bottom:1px solid #ddd;padding:18px 0}
   pre{white-space:pre-wrap;font-family:Georgia,serif;font-size:14px;background:#f6f2e8;padding:10px;border-radius:4px}
   img{max-width:45%;float:right;margin:0 0 10px 14px;border:1px solid #ccc}
   section::after{content:"";display:block;clear:both}
   .cite{font-size:10px;vertical-align:super;color:#8a6d1f}
   @media print{body{margin:8mm;max-width:none}}
  </style></head><body><h1>${t(UI.brandTitle)}</h1>${items}
  <p style="font-size:11px;color:#999;font-family:sans-serif">${t(UI.demoBanner)}</p></body></html>`);
  w.document.close();
  setTimeout(()=>{try{w.focus();w.print();}catch(e){}},500);
}
